  .redes{ display:flex; gap:12px; margin-top:20px; }

  .desktop-izq .logo-carma{ width:230px; }
  .lema{ margin-top:15px; font-size:12px; color:var(--oro); }
  .desktop-der{ width:62%; padding:30px 35px; }
  .selector-idioma{ display:flex; gap:10px; margin-bottom:20px; }
  .selector-idioma button{ flex:1; padding:10px; border-radius:12px; border:1px solid rgba(197,160,89,.28); background:rgba(255,255,255,.06); color:#fff; cursor:pointer; font-weight:600; }
  .selector-idioma button .fa-check{ display:none; margin-left:6px; }
  .selector-idioma button.activo .fa-check{ display:inline; }
  .selector-idioma button.activo{ background:#fff; color:#1b365d; border-color:#fff; }
  .dato{ background:rgba(255,255,255,.06); padding:12px 15px; border-radius:12px; margin-bottom:10px; font-size:14px; }
  .dato{ display:flex; align-items:center; gap:12px; }
  .dato > .ico{ flex:none; width:36px; height:36px; border-radius:10px; background:rgba(197,160,89,.15); color:var(--oro); display:flex; justify-content:center; align-items:center; font-size:15px; }
  .dato > div{ min-width:0; }
  .dato b{ display:block; font-size:11px; color:var(--texto-suave); text-transform:uppercase; letter-spacing:1px; }

  /* ===== MÓVIL: TARJETA DE PRESENTACIÓN (CUBO 3D) ===== */
  .movil{ display:none; }
  .serif{ font-family:'Playfair Display', Georgia, serif; }
  .escena{ width:var(--ancho); height:var(--alto); perspective:1100px; }
  .cubo{
    width:100%; height:100%; position:relative; transform-style:preserve-3d;
    transform:translateZ(calc(var(--ancho) * -0.5)) rotateY(0deg);
    transition:transform .9s cubic-bezier(.2,.8,.2,1);
  }
  .cara{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:14px; padding:44px 32px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    background:
      radial-gradient(90% 55% at 50% 0%, rgba(179,143,64,.16), transparent 70%),
      linear-gradient(180deg, #1b365d 0%, #0f2547 62%, #0d1e38 100%);
    box-shadow:0 30px 60px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  }
  /* Marco fino dorado, como tarjeta impresa */
  .cara::before{
    content:''; position:absolute; inset:12px; border:1px solid rgba(197,160,89,.35);
    border-radius:8px; pointer-events:none;
  }
  .frente { transform:rotateY(0deg)   translateZ(calc(var(--ancho) * 0.5)); }
  .izq    { transform:rotateY(-90deg) translateZ(calc(var(--ancho) * 0.5)); }
  .der    { transform:rotateY(90deg)  translateZ(calc(var(--ancho) * 0.5)); }

  /* Elementos comunes */
  .mono{ width:64px; height:64px; border:1px solid var(--oro); border-radius:50%; display:flex; justify-content:center; align-items:center; color:var(--oro); font-size:24px; }
  .linea{ display:block; width:36px; height:1px; background:var(--oro); margin:18px auto; }
  .giro{ font-size:9.5px; font-weight:400; letter-spacing:.32em; text-transform:uppercase; color:var(--texto-suave); }
  .etiqueta{ font-size:9px; letter-spacing:.35em; text-transform:uppercase; color:var(--oro); }

  /* Frente */
  .frente{ justify-content:center; }
  .frente .logo-carma{ width:250px; }
  .nombre{ font-family:'Playfair Display', Georgia, serif; font-weight:500; font-size:34px; line-height:1.05; letter-spacing:.14em; text-transform:uppercase; }
  .frase{ font-family:'Playfair Display', Georgia, serif; font-style:italic; font-size:15px; color:var(--oro-claro); margin-top:34px; }
  .pie{ position:absolute; bottom:44px; left:28px; right:28px; display:flex; justify-content:space-between; align-items:center; }
  .pista{ color:var(--oro); font-size:12px; opacity:.7; }
  .pista-old{ background:none; border:none; color:var(--texto-suave); display:flex; align-items:center; gap:6px; font-size:10px; cursor:pointer; padding:6px; }
  .pista .flag{ width:20px; height:13px; margin:0; border-radius:2px; opacity:.9; }
  .instruccion{ font-size:8.5px; letter-spacing:.2em; text-transform:uppercase; color:#94a3b8; max-width:120px; line-height:1.6; }
  .instruccion i{ display:block; font-size:16px; color:var(--oro); margin:0 auto 6px; animation:balanceo 2s ease-in-out infinite; }
  @keyframes balanceo{ 0%,100%{transform:rotate(-18deg)} 50%{transform:rotate(18deg)} }

  /* Caras de contacto (izquierda = español, derecha = inglés) */
  .contacto{ justify-content:center; padding:40px 34px; }
  .contacto .bandera{ width:132px; height:88px; object-fit:cover; border-radius:4px; outline:1px solid rgba(197,160,89,.55); outline-offset:5px; margin-bottom:22px; }
  .contacto .etiqueta{ font-size:10px; margin-top:6px; }
  .contacto .info{ width:100%; display:flex; flex-direction:column; align-items:center; transition:opacity .5s ease .1s; }
  .contacto .intro{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:22px; opacity:0; pointer-events:none; transition:opacity .45s ease; }
  .bandera-intro{ width:180px; height:120px; object-fit:cover; border-radius:4px; outline:1px solid rgba(197,160,89,.55); outline-offset:6px; box-shadow:0 18px 40px rgba(0,0,0,.35); }
  .contacto.con-intro .intro{ opacity:1; transition:none; }
  .contacto.con-intro .info{ opacity:0; transition:none; }
  .contacto .logo-carma{ width:80px; margin-top:18px; opacity:.9; }
  .contacto .nombre{ font-size:24px; margin-top:14px; }
  .contacto .linea{ margin:14px auto 6px; }
  .filas{ width:100%; text-align:left; }
  .fila{ display:flex; gap:14px; align-items:flex-start; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.08); }
  .fila:last-child{ border-bottom:none; }
  .fila > i{ width:14px; color:var(--oro); font-size:12px; margin-top:4px; text-align:center; }
  .fila b{ display:block; font-size:8.5px; font-weight:400; letter-spacing:.26em; text-transform:uppercase; color:#94a3b8; margin-bottom:1px; }
  .fila span, .fila a{ display:block; font-size:12.5px; line-height:1.45; color:#fff; }
  .redes-min{ display:flex; gap:22px; margin-top:16px; }
  .redes-min a{ color:var(--texto-suave); font-size:14px; transition:color .2s; }
  .redes-min a:hover{ color:var(--oro); }
  .btn-volver{ margin-top:18px; background:none; border:none; color:#94a3b8; font-size:9px; letter-spacing:.28em; text-transform:uppercase; cursor:pointer; padding:6px; }
  .btn-volver i{ margin-right:8px; }

  @media (max-width:768px){
    .desktop{ display:none; }
    .movil{ display:block; width:100%; height:100%; }
    html, body{ height:100%; overscroll-behavior:none; }
    body{ background:#0d1e38; display:block; }
    :root{ --ancho:100vw; --alto:100vh; }
    @supports (height:100dvh){ :root{ --alto:100dvh; } }
    .escena{ perspective:1400px; touch-action:pan-y; }
    .cara{ border-radius:0; box-shadow:none; }
    .cara::before{ inset:16px; border-radius:4px; }
    .nombre{ font-size:40px; }
    .contacto .nombre{ font-size:26px; }
  }
  @media (max-width:768px) and (max-height:640px){ .cara{ padding:34px 28px; } .frente .logo-carma{ width:210px; } .contacto .bandera{ width:110px; height:73px; margin-bottom:14px; } .contacto .logo-carma{ display:none; } .fila{ padding:8px 0; } }
</style>
</head>

    <div class="dato"><span class="ico"><i class="fa-solid fa-phone"></i></span><div><b data-k="tel">Teléfonos</b><a data-v="telVal"></a></div></div>
    <div class="dato"><span class="ico"><i class="fa-solid fa-envelope"></i></span><div><b data-k="correo">Correo</b><a data-v="correoVal"></a></div></div>
    <div class="dato"><span class="ico"><i class="fa-solid fa-clock"></i></span><div><b data-k="horario">Horario</b><span data-v="horarioVal"></span></div></div>
  </div>
</div>

<!-- Plantilla de la cara de contacto (se llena en cada idioma) -->
<template id="tpl-contacto">
  <!-- Bandera: solo aparece al girar hacia este idioma -->
  <div class="intro">
    <img class="bandera-intro" data-flag src="" alt="">
    <p class="etiqueta" data-m="pais"></p>
  </div>
  <!-- Información -->
  <div class="info">
  <p class="etiqueta" data-m="pais"></p>
  <span class="linea"></span>
  <div class="filas">
    <div class="fila"><i class="fa-solid fa-location-dot"></i><div><b data-m="dir"></b><span data-mv="dirVal"></span></div></div>
    <div class="fila"><i class="fa-solid fa-phone"></i><div><b data-m="tel"></b><a data-mv="telVal"></a></div></div>
    <div class="fila"><i class="fa-solid fa-envelope"></i><div><b data-m="correo"></b><a data-mv="correoVal"></a></div></div>
    <div class="fila"><i class="fa-regular fa-clock"></i><div><b data-m="horario"></b><span data-mv="horarioVal"></span></div></div>
  </div>
  <div class="redes-min">
    <a href="#" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
    <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
    <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
    <a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
  </div>
  <div class="logo-carma" role="img" aria-label="Grupo Carma"></div>
  <button class="btn-volver" onclick="volver()"><i class="fa-solid fa-arrow-left"></i><span data-m="volver"></span></button>
  </div>
</template>

<!-- ========== MÓVIL ========== -->
<div class="movil">
  <div class="escena">
    <div class="cubo" id="cubo">

      <!-- Frente -->
      <div class="cara frente">
        <div class="logo-carma" role="img" aria-label="Grupo Carma Abogados &amp; Contadores"></div>
        <span class="linea" style="margin-top:26px;width:48px"></span>
        <p class="frase" style="margin-top:4px">Su seguridad, nuestro compromiso</p>
        <div class="pie">
          <i class="fa-solid fa-chevron-left pista"></i>
          <span class="instruccion"><i class="fa-solid fa-mobile-screen-button"></i><span id="instruccion">Inclina o desliza para elegir idioma</span></span>
          <i class="fa-solid fa-chevron-right pista"></i>
        </div>
      </div>

      <!-- Contacto en español (lado izquierdo) y en inglés (lado derecho) -->
      <div class="cara izq contacto" id="contacto-es"></div>
      <div class="cara der contacto" id="contacto-en"></div>

    </div>
  </div>
</div>


<script>
/* ================= TEXTOS ================= */
const textos = {
  es: {
    titulo:"Contacto", pais:"México · Español", volver:"Volver", flag:"https://flagcdn.com/w40/mx.png",
    sub:"Abogados y Contadores", lema:"Su seguridad, nuestro compromiso",
    dir:"Dirección",  dirVal:"Av. Reforma #123, Puebla, México",
    tel:"Teléfonos",  telVal:"222 123 4567 / 222 765 4321", telLink:"tel:+522221234567",
    correo:"Correo",  correoVal:"contacto@grupocarma.com",
    horario:"Horario", horarioVal:"Lun - Vie 9:00 - 18:00"
  },
  en: {
    titulo:"Contact", pais:"Canada · English", volver:"Back", flag:"https://flagcdn.com/w40/ca.png",
    sub:"Lawyers and Accountants", lema:"Your security, our commitment",
    dir:"Address",   dirVal:"123 Reforma Ave, Puebla, Mexico",
    tel:"Phone",     telVal:"+52 222 123 4567", telLink:"tel:+522221234567",
    correo:"Email",  correoVal:"contacto@grupocarma.com",
    horario:"Hours", horarioVal:"Mon - Fri 9:00 AM - 6:00 PM"
  }
};

function llenar(raiz, t, attrK, attrV){
  raiz.querySelectorAll(`[${attrK}]`).forEach(el => el.textContent = t[el.getAttribute(attrK)]);
  raiz.querySelectorAll(`[${attrV}]`).forEach(el => {
    el.textContent = t[el.getAttribute(attrV)];
    if(el.tagName === 'A'){
      el.href = el.getAttribute(attrV) === 'telVal' ? t.telLink : 'mailto:' + t.correoVal;
    }
  });
}

/* ================= PC ================= */
function cambiarIdiomaDesktop(idioma){
  const t = textos[idioma];
  llenar(document.querySelector('.desktop'), t, 'data-k', 'data-v');
  document.getElementById('d-lema').textContent = t.lema;
  document.getElementById('btn-es').classList.toggle('activo', idioma === 'es');
  document.getElementById('btn-en').classList.toggle('activo', idioma === 'en');
}
cambiarIdiomaDesktop('es');

/* ================= MÓVIL ================= */
const UMBRAL = 30;   // grados de inclinación para cambiar de cara
const CENTRO = 12;   // grados para considerar el celular "derecho"
const DURACION_BANDERA = 1700; // ms que se ve la bandera antes de la información

const cubo = document.getElementById('cubo');
let estado = 'portada';       // portada | es | en
let esperarCentro = false;    // tras "Volver", espera a que el celular se enderece

// Llena las dos caras de contacto, una por idioma
['es','en'].forEach(idioma => {
  const cara = document.getElementById('contacto-' + idioma);
  cara.appendChild(document.getElementById('tpl-contacto').content.cloneNode(true));
  llenar(cara, textos[idioma], 'data-m', 'data-mv');
  const bandera = cara.querySelector('[data-flag]');
  bandera.src = textos[idioma].flag.replace('/w40/', '/w320/');
  bandera.alt = textos[idioma].pais;
  
});

function girar(cara){
  if(cara === estado) return;
  estado = cara;
  const angulos = { portada:0, es:90, en:-90 };
  cubo.style.transform = `translateZ(${-cubo.offsetWidth / 2}px) rotateY(${angulos[cara]}deg)`;
  if(cara !== 'portada'){
    // Primero se ve la bandera y luego aparece la información
    const el = document.getElementById('contacto-' + cara);
    el.classList.add('con-intro');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('con-intro'), DURACION_BANDERA);
  }
  if(cara !== 'portada' && navigator.vibrate) navigator.vibrate(30);
}

function volver(){
  esperarCentro = true;
  girar('portada');
}

/* ---------- Deslizar con el dedo ---------- */
let x0 = null, y0 = null;
const escena = document.querySelector('.escena');
escena.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
escena.addEventListener('touchend', e => {
  if(x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  x0 = null;
  if(Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;   // no fue un deslizamiento horizontal
  const haciaDerecha = dx > 0;
  if(estado === 'portada')               girar(haciaDerecha ? 'es' : 'en');
  else if(estado === 'es' && !haciaDerecha) volver();
  else if(estado === 'en' &&  haciaDerecha) volver();
}, {passive:true});

/* ---------- Giroscopio ---------- */
let recibioDatos = false;

function alInclinar(e){
  if(e.gamma === null) return;
  recibioDatos = true;
  const g = e.gamma; // izquierda = negativo, derecha = positivo

  if(esperarCentro){
    if(Math.abs(g) < CENTRO) esperarCentro = false;
    return;
  }
  // Inclinar a un lado abre el contacto en ese idioma; se queda ahí al enderezar
  if(g < -UMBRAL)      girar('es');
  else if(g > UMBRAL)  girar('en');
}

const esMovil = window.matchMedia('(max-width:768px)').matches;
const pideIOS = typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function';
const aviso = txt => document.getElementById('instruccion').textContent = txt;

if(esMovil){
  window.addEventListener('deviceorientation', alInclinar);
  setTimeout(() => { if(!recibioDatos && !pideIOS) aviso('Desliza para elegir idioma'); }, 2000);

  if(pideIOS){
    // iPhone: Apple solo entrega datos tras un toque, así que el permiso
    // se pide en el primer toque en cualquier parte de la pantalla
    setTimeout(() => { if(!recibioDatos) aviso('Toca, luego inclina o desliza'); }, 800);
    const pedirPermiso = async () => {
      document.removeEventListener('touchend', pedirPermiso);
      document.removeEventListener('click', pedirPermiso);
      if(recibioDatos) return;
      try{
        const p = await DeviceOrientationEvent.requestPermission();
        aviso(p === 'granted' ? 'Inclina o desliza para elegir idioma' : 'Desliza para elegir idioma');
      }catch(err){ aviso('Desliza para elegir idioma'); }
    };
    document.addEventListener('touchend', pedirPermiso);
    document.addEventListener('click', pedirPermiso);
  }
}
</script>
</body>
</html>
