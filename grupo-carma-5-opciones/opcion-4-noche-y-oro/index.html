    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--sans);
      background: var(--pagina);
      color: var(--tx);
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(20px, 4vw, 48px);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    ul {
      list-style: none;
    }

    :focus-visible {
      outline: 2px solid var(--acento);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .ico {
      width: 1em;
      height: 1em;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ico-marca {
      fill: currentColor;
      stroke: none;
    }

    .logo {
      background: var(--logo) center/contain no-repeat;
      aspect-ratio: 678/582;
    }

    /* ===== Elementos comunes ===== */
    .filas {
      width: 100%;
      transition: opacity .18s ease;
    }

    .fila {
      display: grid;
      grid-template-columns: 20px 1fr;
      gap: 16px;
      align-items: start;
      padding: 15px 0;
      border-bottom: 1px solid var(--linea);
    }

    .fila:last-child {
      border-bottom: 0;
    }

    .fila>.ico {
      font-size: 19px;
      color: var(--acento);
      margin-top: 2px;
    }

    .fila>div {
      min-width: 0;
    }

    .fila b {
      display: block;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--tx2);
      margin-bottom: 4px;
    }

    .fila span,
    .fila a {
      font-size: 15.5px;
      line-height: 1.45;
      color: var(--tx);
      overflow-wrap: anywhere;
    }

    .fila>div>a,
    .fila>div>span {
      display: block;
    }

    .fila a {
      text-decoration: underline;
      text-decoration-color: transparent;
      text-underline-offset: 3px;
      transition: text-decoration-color .2s;
    }

    .fila a:hover {
      text-decoration-color: var(--acento);
    }

    .redes {
      display: flex;
      gap: 10px;
    }

    .redes a {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 15px;
      color: var(--tx);
      border: 1px solid var(--linea);
      transition: background .2s, color .2s, border-color .2s;
    }

    .redes a:hover {
      background: var(--acento);
      border-color: var(--acento);
      color: var(--sobre-acento);
    }

    /* ===== ESCRITORIO ===== */
    .tarjeta {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: 5fr 7fr;
      position: relative;
      background: var(--sup);
      border-radius: var(--radio, 16px);
      overflow: hidden;
      transform: perspective(1400px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transition: transform .35s ease-out;
      animation: entrar .7s cubic-bezier(.2, .7, .2, 1) both;
    }

    @keyframes entrar {
      from {
        opacity: 0;
        translate: 0 14px;
      }

      to {
        opacity: 1;
        translate: 0 0;
      }
    }

    .t-marca {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 22px;
      padding: 44px 36px;
    }

    .t-marca .logo {
      width: min(240px, 100%);
    }

    .lema {
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.4;
      color: var(--acento);
      transition: opacity .18s ease;
    }

    .t-datos {
      padding: 40px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }

    .cambiando .filas,
    .cambiando .lema {
      opacity: 0;
    }

    .idiomas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--linea);
      border-radius: 999px;
    }

    .idiomas button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: var(--tx2);
      transition: background .25s, color .25s;
      white-space: nowrap;
    }

    .idiomas button:hover {
      color: var(--tx);
    }

    .idiomas button[aria-pressed="true"] {
      background: var(--activo-bg);
      color: var(--activo-tx);
    }

    .idiomas img {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      object-fit: cover;
      flex: none;
    }

    /* Reflejo que sigue al ratón */
    body[data-inclinar] .tarjeta::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), var(--reflejo, rgba(255, 255, 255, .07)), transparent 70%);
    }

    /* ===== MÓVIL: TARJETA QUE SE VOLTEA ===== */
    .movil {
      display: none;
    }

    .escena {
      --w: min(88vw, 400px);
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      perspective: 1200px;
      touch-action: pan-y;
      padding: 12px 0;
    }

    .inclina {
      --bx: 50%;
      --by: 30%;
      width: var(--w);
      height: min(calc(100dvh - 92px), calc(var(--w) * 1.62));
      transform-style: preserve-3d;
      transition: transform .18s linear;
    }

    .inclina.sin-giro {
      animation: mecer 6s ease-in-out infinite;
    }

    @keyframes mecer {

      0%,
      100% {
        transform: rotateY(-5deg) rotateX(2deg);
      }

      50% {
        transform: rotateY(5deg) rotateX(-1deg);
      }
    }

    .carta {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .85s cubic-bezier(.2, .8, .2, 1);
    }

    .cara {
      position: absolute;
      inset: 0;
      overflow: hidden;
      container-type: size;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--cara);
      color: var(--tx);
      border-radius: var(--radio-movil, 14px);
      box-shadow: var(--sombra-carta);
    }

    /* Las caras van 1px por delante y el contenedor no recibe toques:
   si no, queda en el mismo plano que la cara y a veces se queda con el toque */
    .inclina,
    .carta {
      pointer-events: none;
    }

    .cara {
      pointer-events: auto;
    }

    .frente {
      transform: translateZ(1px);
    }

    .dorso {
      transform: rotateY(180deg) translateZ(1px);
    }

    .frente {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 26px;
    }

    .capa {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s ease, visibility .3s;
    }

    .capa.visible {
      opacity: 1;
      visibility: visible;
    }

    /* Reflejo de luz que se mueve con el giroscopio */
    .brillo {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      mix-blend-mode: var(--brillo-modo, screen);
      background: radial-gradient(70% 45% at var(--bx) var(--by), var(--brillo, rgba(255, 255, 255, .16)), transparent 70%);
    }

    .linea {
      display: block;
      width: 44px;
      height: 1px;
      background: var(--acento);
    }

    .etiqueta {
      font-size: 10.5px;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--acento);
    }

    /* Anverso */
    .p-marca {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .frente .logo {
      width: min(72cqw, 290px);
    }

    .p-texto {
      margin-bottom: auto;
      padding-top: 22px;
    }

    .frase {
      font-family: var(--serif);
      font-size: clamp(16px, 5.4cqw, 21px);
      line-height: 1.35;
      color: var(--acento);
    }

    /* Ayuda bajo la tarjeta */
    .pista {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 18px;
      font-size: 12.5px;
      color: var(--pista);
    }

    .pista .ico {
      font-size: 18px;
      animation: rotar 2.2s ease-in-out infinite;
    }

    @keyframes rotar {

      0%,
      100% {
        rotate: -16deg;
      }

      50% {
        rotate: 16deg;
      }
    }

    /* Burbujas de idioma */
    .selector {
      justify-content: center;
      gap: clamp(24px, 8cqh, 48px);
      padding: 26px 16px 14px;
    }

    .sel-es {
      font-family: var(--serif);
      font-size: clamp(24px, 8.4cqw, 32px);
      line-height: 1.2;
      color: var(--tx);
    }

    .sel-en {
      margin-top: 6px;
      font-size: 13px;
      color: var(--tx2);
    }

    .burbujas {
      display: flex;
      justify-content: center;
      gap: clamp(16px, 7cqw, 34px);
    }

    .burbuja {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: scale .25s cubic-bezier(.3, 1.4, .5, 1);
    }

    .burbuja:active {
      scale: .93;
    }

    .burbuja.cerca {
      scale: 1.12;
    }

    .burbuja-esfera {
      position: relative;
      display: block;
      width: clamp(92px, 33cqw, 132px);
      aspect-ratio: 1;
      border-radius: 50%;
      padding: 4px;
      margin-bottom: 16px;
      background: linear-gradient(150deg, rgba(255, 255, 255, .9), var(--oro) 45%, rgba(255, 255, 255, .35));
      box-shadow: 0 14px 28px var(--sombra-burbuja), 0 2px 6px var(--sombra-burbuja);
      animation: flotar 4.2s ease-in-out infinite;
    }

    .burbuja:last-child .burbuja-esfera {
      animation-delay: -2.1s;
    }

    .burbuja-esfera img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Brillo de burbuja */
    .burbuja-esfera::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(circle at 32% 24%, rgba(255, 255, 255, .85), rgba(255, 255, 255, .18) 22%, transparent 42%),
        radial-gradient(circle at 50% 50%, transparent 58%, rgba(10, 20, 40, .28) 100%);
    }

    @keyframes flotar {

      0%,
      100% {
        translate: 0 -5px;
      }

      50% {
        translate: 0 5px;
      }
    }

    .selector.visible .burbuja {
      animation: brotar .6s cubic-bezier(.3, 1.5, .5, 1) .4s backwards;
    }

    .selector.visible .burbuja:last-child {
      animation-delay: .52s;
    }

    @keyframes brotar {
      from {
        opacity: 0;
        scale: .4;
      }

      to {
        opacity: 1;
        scale: 1;
      }
    }

    .burbuja-nombre {
      font-size: 15.5px;
      font-weight: 500;
      color: var(--tx);
    }

    .burbuja-pais {
      margin-top: 2px;
      font-size: 12px;
      color: var(--tx2);
    }

    .volver {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 44px;
      padding: 0 14px;
      font-size: 12.5px;
      color: var(--tx2);
    }

    .volver .ico {
      font-size: 15px;
    }

    /* Contacto */
    .c-cab {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: clamp(20px, 5.500cqh, 36px) 24px 0;
    }

    .c-cab .logo {
      width: clamp(70px, 25cqw, 104px);
    }

    .c-cuerpo {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(4px, 1.6cqh, 14px);
      padding: 6px 24px 8px;
      text-align: left;
      min-height: 0;
    }

    .contacto .fila {
      grid-template-columns: 18px 1fr;
      gap: 13px;
      padding: clamp(7px, 1.6cqh, 13px) 0;
    }

    .contacto .fila span,
    .contacto .fila a {
      font-size: 14.5px;
    }

    .contacto .redes a {
      width: 38px;
      height: 38px;
    }

    @container (max-height:500px) {
      .c-cab .logo {
        display: none;
      }

      .c-cab {
        padding-top: 24px;
      }

      .contacto .fila {
        padding: 5px 0;
      }

      .contacto .fila span,
      .contacto .fila a {
        font-size: 13.5px;
      }

      .contacto .fila b {
        margin-bottom: 1px;
        font-size: 9.5px;
      }
    }

    @media (max-width:768px) {

      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        background: var(--pagina-movil);
        display: block;
        padding: 0;
        min-height: 0;
      }

      body::before {
        display: none;
      }

      .tarjeta {
        display: none !important;
      }

      .movil {
        display: block;
        width: 100%;
        height: 100%;
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition-duration: .01ms !important;
      }
    }

    /* ===== NOCHE Y ORO ===== */
    :root {
      --serif: 'Bodoni Moda', Georgia, serif;
      --sans: 'Jost', system-ui, sans-serif;
      --oro: #d4bb76;
      --acento: #d9c17e;
      --sobre-acento: #080f20;
      --pagina: radial-gradient(90% 70% at 50% 40%, #12203c, #060b18 75%);
      --pagina-movil: #060b18;
      --pista: #a9a48f;
      --sombra-carta: 0 0 0 1px rgba(212, 187, 118, .35), 0 30px 60px -18px #000;
      --radio-movil: 4px;
      --sup: #0a1329;
      --cara: radial-gradient(120% 60% at 50% 100%, rgba(212, 187, 118, .13), transparent 62%), #0a1329;
      --tx: #f3efe4;
      --tx2: #98a2b6;
      --linea: rgba(212, 187, 118, .2);
      --activo-bg: linear-gradient(135deg, #e6d591, #ab914f);
      --activo-tx: #0a1329;
      --sombra-burbuja: rgba(0, 0, 0, .6);
      --radio: 3px;
      --reflejo: rgba(212, 187, 118, .09);
    }

    body {
      background-attachment: fixed;
    }

    .tarjeta {
      width: min(1000px, 100%);
      grid-template-columns: 1fr minmax(210px, 250px) 1fr;
      column-gap: 36px;
      align-items: center;
      padding: 46px 54px;
      border: 1px solid var(--oro);
      box-shadow: 0 0 0 7px #0a1329, 0 0 0 8px rgba(212, 187, 118, .3), 0 50px 90px -30px #000;
    }

    .t-marca,
    .t-datos,
    #d-filas {
      display: contents;
    }

    .idiomas {
      grid-column: 1/-1;
      grid-row: 1;
      justify-self: center;
      width: min(390px, 100%);
      margin-bottom: 26px;
    }

    .t-marca .logo {
      grid-column: 2;
      grid-row: 2/4;
      width: 100%;
    }

    #d-filas .fila {
      border: 0;
      padding: 14px 0;
    }

    #d-filas .fila:nth-child(1) {
      grid-column: 1;
      grid-row: 2;
    }

    #d-filas .fila:nth-child(2) {
      grid-column: 1;
      grid-row: 3;
    }

    #d-filas .fila:nth-child(3) {
      grid-column: 3;
      grid-row: 2;
    }

    #d-filas .fila:nth-child(4) {
      grid-column: 3;
      grid-row: 3;
    }

    /* Columna izquierda en espejo */
    #d-filas .fila:nth-child(-n+2) {
      grid-template-columns: 1fr 20px;
      text-align: right;
    }

    #d-filas .fila:nth-child(-n+2) .ico {
      order: 2;
    }

    .lema {
      grid-column: 1/-1;
      grid-row: 4;
      margin-top: 26px;
      font-size: 14px;
      letter-spacing: .24em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ab914f, #e9da9a 50%, #ab914f);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-align: center;
    }

    .t-marca .redes {
      grid-column: 1/-1;
      grid-row: 5;
      justify-self: center;
      margin-top: 18px;
    }

    .fila b {
      color: var(--acento);
    }

    .cara::before {
      content: '';
      position: absolute;
      inset: 9px;
      border: 1px solid var(--oro);
      pointer-events: none;
    }

    .cara::after {
      content: '';
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(212, 187, 118, .28);
      pointer-events: none;
    }

    .frase {
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      line-height: 1.9;
      max-width: 230px;
    }

    .linea {
      width: 96px;
      background: linear-gradient(90deg, transparent, var(--oro), transparent);
    }

    .sel-es {
      font-weight: 400;
    }

    .c-cuerpo {
      padding-left: 30px;
      padding-right: 30px;
      padding-bottom: 22px;
    }

    .c-cab {
      padding-top: clamp(26px, 6cqh, 40px);
    }

    @media (max-width:900px) and (min-width:769px) {
      .tarjeta {
        padding: 36px 30px;
        column-gap: 20px;
        grid-template-columns: 1fr 170px 1fr;
      }
    }
  </style>
</head>

        tel: "Phone", telVal: [["+52 222 123 4567", "+522221234567"]],
        correo: "Email", correoVal: "contacto@grupocarma.com",
        horario: "Hours", horarioVal: "Mon - Fri 9:00 AM - 6:00 PM"
      }
    };

    /* ================= RELLENO ================= */
    const clonar = id => document.getElementById(id).content.cloneNode(true);

    function llenar(raiz, t) {
      raiz.querySelectorAll('[data-t]').forEach(el => el.textContent = t[el.dataset.t]);
      raiz.querySelectorAll('[data-tel]').forEach(el => {
        el.textContent = '';
        t.telVal.forEach(([texto, numero], i) => {
          if (i) el.append(' / ');
          const a = document.createElement('a');
          a.href = 'tel:' + numero;
          a.textContent = texto;
          el.append(a);
        });
      });
      raiz.querySelectorAll('[data-correo]').forEach(el => {
        el.textContent = t.correoVal;
        el.href = 'mailto:' + t.correoVal;
      });
    }

    function ponerRedes(raiz) {
      raiz.querySelectorAll('[data-redes]').forEach(el => {
        el.append(clonar('tpl-redes'));
        el.querySelectorAll('[data-red]').forEach(a => {
          a.href = redes[a.dataset.red];
          if (a.getAttribute('href') !== '#') { a.target = '_blank'; a.rel = 'noopener'; }
        });
      });
    }

    const sinMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ================= PC ================= */
    const tarjeta = document.getElementById('tarjeta');
    document.getElementById('d-filas').append(clonar('tpl-filas'));
    ponerRedes(tarjeta);

    function marcarIdioma(idioma) {
      tarjeta.querySelectorAll('[data-idioma]').forEach(b => {
        b.setAttribute('aria-pressed', b.dataset.idioma === idioma);
      });
    }
    function pintarDesktop(idioma) {
      const t = textos[idioma];
      llenar(tarjeta, t);
      document.getElementById('d-lema').textContent = t.lema;
      document.documentElement.lang = idioma;
      marcarIdioma(idioma);
    }

    let idiomaDesktop = 'es', tCambio;
    function cambiarIdiomaDesktop(idioma) {
      if (idioma === idiomaDesktop) return;
      idiomaDesktop = idioma;
      clearTimeout(tCambio);
      tarjeta.classList.add('cambiando');
      marcarIdioma(idioma);
      tCambio = setTimeout(() => {
        pintarDesktop(idioma);
        tarjeta.classList.remove('cambiando');
      }, sinMovimiento ? 0 : 180);
    }
    tarjeta.querySelectorAll('[data-idioma]').forEach(b => {
      b.addEventListener('click', () => cambiarIdiomaDesktop(b.dataset.idioma));
    });
    pintarDesktop('es');

    /* Inclinación sutil de la tarjeta al mover el ratón */
    if (document.body.dataset.inclinar !== undefined && !sinMovimiento &&
      window.matchMedia('(hover:hover) and (pointer:fine)').matches) {
      tarjeta.addEventListener('pointermove', e => {
        const r = tarjeta.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        tarjeta.style.setProperty('--rx', ((.5 - y) * 3).toFixed(2) + 'deg');
        tarjeta.style.setProperty('--ry', ((x - .5) * 3).toFixed(2) + 'deg');
        tarjeta.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
        tarjeta.style.setProperty('--my', (y * 100).toFixed(1) + '%');
      });
      tarjeta.addEventListener('pointerleave', () => {
        tarjeta.style.setProperty('--rx', '0deg');
        tarjeta.style.setProperty('--ry', '0deg');
      });
    }

    /* ================= MÓVIL ================= */
    const inclina = document.getElementById('inclina');
    const carta = document.getElementById('carta');
    const portada = document.getElementById('portada');
    const dorso = document.getElementById('dorso');
    const selector = document.getElementById('selector');
    const contacto = document.getElementById('contacto');
    const burbujas = {};
    document.querySelectorAll('[data-elegir]').forEach(b => burbujas[b.dataset.elegir] = b);

    let estado = 'portada';       // portada | selector | contacto
    let sentido = 1;              // hacia qué lado se volteó la tarjeta
    let idiomaMovil = null;
    let esperarCentro = false;    
    let cambiando = false;

    document.getElementById('m-filas').append(clonar('tpl-filas'));
    ponerRedes(contacto);

    function aplicar() {
      carta.style.transform = `rotateY(${anguloBase()}deg)`;
      portada.inert = estado !== 'portada';
      contacto.inert = estado !== 'contacto';
      selector.classList.toggle('visible', estado === 'selector');
      contacto.classList.toggle('visible', estado === 'contacto');
      pintarPista();
    }

    function vibrar() { if (navigator.vibrate) navigator.vibrate(30); }

    function voltear(nuevoSentido = 1) {
      sentido = nuevoSentido;
      estado = 'selector';
      aplicar();
      vibrar();
    }

    function aPortada() {
      esperarCentro = true;
      estado = 'portada';
      aplicar();
      marcarCerca(null);
      vibrar();
    }

    function elegir(idioma) {
      idiomaMovil = idioma;
      llenar(contacto, textos[idioma]);
      contacto.lang = idioma;
      esperarCentro = true;   
      estado = 'contacto';
      aplicar();
      marcarCerca(null);
    }

    function elegirDirecto(idioma) {
      idiomaMovil = idioma;
      llenar(contacto, textos[idioma]);
      contacto.lang = idioma;
      esperarCentro = true;
      estado = 'contacto'; 
      aplicar();
      marcarCerca(null);
      vibrar();
    }

    /* Cambia de idioma dando la vuelta completa a la tarjeta */
    function cambiarIdiomaMovil(idioma, giro) {
      if (idioma === idiomaMovil || cambiando) return;
      vibrar();
      if (sinMovimiento) { elegir(idioma); esperarCentro = false; return; }
      cambiando = true;
      const base = anguloBase();
      const paso = (de, a, easing, ms) => carta.animate(
        [{ transform: `rotateY(${de}deg)` }, { transform: `rotateY(${a}deg)` }],
        { duration: ms, easing }
      );
      paso(base, base + 90 * giro, 'ease-in', 240).onfinish = () => {
        idiomaMovil = idioma;
        llenar(contacto, textos[idioma]);
        contacto.lang = idioma;
        paso(base - 90 * giro, base, 'cubic-bezier(.2,.8,.2,1)', 420).onfinish = () => { cambiando = false; };
      };
    }

    /* ---------- Control Táctil por Lados e Idiomas ---------- */
    let x0 = null, y0 = null;
    const escena = document.getElementById('escena');

    escena.addEventListener('touchstart', e => { 
      x0 = e.touches[0].clientX; 
      y0 = e.touches[0].clientY; 
    }, { passive: true });

    escena.addEventListener('touchend', e => {
      if (x0 === null) return;
      
      const x1 = e.changedTouches[0].clientX;
      const y1 = e.changedTouches[0].clientY;
      const dx = x1 - x0;
      const dy = y1 - y0;
      x0 = null;

      // 1. Si el usuario realiza un DESLIZAMIENTO (Swipe) horizontal:
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        const haciaDerecha = dx > 0;
        if (estado === 'portada') {
          voltear(haciaDerecha ? 1 : -1);
        } else if (estado === 'contacto') {
          cambiarIdiomaMovil(haciaDerecha ? 'es' : 'en', haciaDerecha ? -1 : 1);
        }
        return; 
      }

      // 2. Si es un TOQUE SIMPLE (Tap):
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
        // Obtenemos dimensiones basándonos en la tarjeta visible actualmente
        const elementoActivo = estado === 'portada' ? portada : dorso;
        const dimensiones = elementoActivo.getBoundingClientRect();
        const puntoDelToque = x1 - dimensiones.left;
        const mitad = dimensiones.width / 2;
        const ladoTocado = puntoDelToque < mitad ? 'es' : 'en';

        if (estado === 'portada') {
          // Si está en la portada, va directo al idioma del lado presionado
          sentido = ladoTocado === 'es' ? -1 : 1;
          elegirDirecto(ladoTocado);
        } else if (estado === 'contacto') {
          // Si está en los datos y toca el lado correspondiente al idioma activo, regresa al logo
          if (ladoTocado === idiomaMovil) {
            aPortada();
          } else {
            // Si toca el lado opuesto, cambia de idioma con animación de giro
            cambiarIdiomaMovil(ladoTocado, ladoTocado === 'es' ? -1 : 1);
          }
        }
      }
    }, { passive: true });

    /* ---------- Lógica Auxiliar de Estado y Renderizado ---------- */
    function anguloBase() {
      return estado === 'portada' ? 0 : 180 * sentido;
    }

    function marcarCerca(idioma) {
      Object.entries(burbujas).forEach(([k, b]) => {
        b.classList.toggle('cerca', k === idioma);
      });
    }

    Object.values(burbujas).forEach(b => {
      b.addEventListener('click', () => elegir(b.dataset.elegir));
    });
    
    document.getElementById('a-portada').addEventListener('click', aPortada);
    document.getElementById('c-volver').addEventListener('click', () => {
      aPortada(); 
    });

    /* ---------- Texto de ayuda bajo la tarjeta ---------- */
    const pista = document.getElementById('pista');
    let giroActivo = false;      
    let sinGiro = false;         
    let faltaPermiso = false;    


 </script>
