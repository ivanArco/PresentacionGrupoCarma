    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--sans);
      background: var(--pagina);
      color: var(--tx);
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(20px, 4vw, 48px);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    ul {
      list-style: none;
    }

    :focus-visible {
      outline: 2px solid var(--acento);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .ico {
      width: 1em;
      height: 1em;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ico-marca {
      fill: currentColor;
      stroke: none;
    }

    .logo {
      background: var(--logo) center/contain no-repeat;
      aspect-ratio: 678/582;
    }

    /* ===== Elementos comunes ===== */
    .filas {
      width: 100%;
      transition: opacity .18s ease;
    }

    .fila {
      display: grid;
      grid-template-columns: 20px 1fr;
      gap: 16px;
      align-items: start;
      padding: 15px 0;
      border-bottom: 1px solid var(--linea);
    }

    .fila:last-child {
      border-bottom: 0;
    }

    .fila>.ico {
      font-size: 19px;
      color: var(--acento);
      margin-top: 2px;
    }

    .fila>div {
      min-width: 0;
    }

    .fila b {
      display: block;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--tx2);
      margin-bottom: 4px;
    }

    .fila span,
    .fila a {
      font-size: 15.5px;
      line-height: 1.45;
      color: var(--tx);
      overflow-wrap: anywhere;
    }

    .fila>div>a,
    .fila>div>span {
      display: block;
    }

    .fila a {
      text-decoration: underline;
      text-decoration-color: transparent;
      text-underline-offset: 3px;
      transition: text-decoration-color .2s;
    }

    .fila a:hover {
      text-decoration-color: var(--acento);
    }

    .redes {
      display: flex;
      gap: 10px;
    }

    .redes a {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 15px;
      color: var(--tx);
      border: 1px solid var(--linea);
      transition: background .2s, color .2s, border-color .2s;
    }

    .redes a:hover {
      background: var(--acento);
      border-color: var(--acento);
      color: var(--sobre-acento);
    }

    /* ===== ESCRITORIO ===== */
    .tarjeta {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: 5fr 7fr;
      position: relative;
      background: var(--sup);
      border-radius: var(--radio, 16px);
      overflow: hidden;
      transform: perspective(1400px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transition: transform .35s ease-out;
      animation: entrar .7s cubic-bezier(.2, .7, .2, 1) both;
    }

    @keyframes entrar {
      from {
        opacity: 0;
        translate: 0 14px;
      }

      to {
        opacity: 1;
        translate: 0 0;
      }
    }

    .t-marca {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 22px;
      padding: 44px 36px;
    }

    .t-marca .logo {
      width: min(240px, 100%);
    }

    .lema {
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.4;
      color: var(--acento);
      transition: opacity .18s ease;
    }

    .t-datos {
      padding: 40px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }

    .cambiando .filas,
    .cambiando .lema {
      opacity: 0;
    }

    .idiomas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--linea);
      border-radius: 999px;
    }

    .idiomas button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: var(--tx2);
      transition: background .25s, color .25s;
      white-space: nowrap;
    }

    .idiomas button:hover {
      color: var(--tx);
    }

    .idiomas button[aria-pressed="true"] {
      background: var(--activo-bg);
      color: var(--activo-tx);
    }

    .idiomas img {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      object-fit: cover;
      flex: none;
    }

    /* Reflejo que sigue al ratón */
    body[data-inclinar] .tarjeta::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), var(--reflejo, rgba(255, 255, 255, .07)), transparent 70%);
    }

    /* ===== MÓVIL: TARJETA QUE SE VOLTEA ===== */
    .movil {
      display: none;
    }

    .escena {
      --w: min(88vw, 400px);
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      perspective: 1200px;
      touch-action: pan-y;
      padding: 12px 0;
    }

    .inclina {
      --bx: 50%;
      --by: 30%;
      width: var(--w);
      height: min(calc(100dvh - 92px), calc(var(--w) * 1.62));
      transform-style: preserve-3d;
      transition: transform .18s linear;
    }

    .inclina.sin-giro {
      animation: mecer 6s ease-in-out infinite;
    }

    @keyframes mecer {

      0%,
      100% {
        transform: rotateY(-5deg) rotateX(2deg);
      }

      50% {
        transform: rotateY(5deg) rotateX(-1deg);
      }
    }

    .carta {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .85s cubic-bezier(.2, .8, .2, 1);
    }

    .cara {
      position: absolute;
      inset: 0;
      overflow: hidden;
      container-type: size;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--cara);
      color: var(--tx);
      border-radius: var(--radio-movil, 14px);
      box-shadow: var(--sombra-carta);
    }

    /* Las caras van 1px por delante y el contenedor no recibe toques:
   si no, queda en el mismo plano que la cara y a veces se queda con el toque */
    .inclina,
    .carta {
      pointer-events: none;
    }

    .cara {
      pointer-events: auto;
    }

    .frente {
      transform: translateZ(1px);
    }

    .dorso {
      transform: rotateY(180deg) translateZ(1px);
    }

    .frente {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 26px;
    }

    .capa {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s ease, visibility .3s;
    }

    .capa.visible {
      opacity: 1;
      visibility: visible;
    }

    /* Reflejo de luz que se mueve con el giroscopio */
    .brillo {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      mix-blend-mode: var(--brillo-modo, screen);
      background: radial-gradient(70% 45% at var(--bx) var(--by), var(--brillo, rgba(255, 255, 255, .16)), transparent 70%);
    }

    .linea {
      display: block;
      width: 44px;
      height: 1px;
      background: var(--acento);
    }

    .etiqueta {
      font-size: 10.5px;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--acento);
    }

    /* Anverso */
    .p-marca {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .frente .logo {
      width: min(72cqw, 290px);
    }

    .p-texto {
      margin-bottom: auto;
      padding-top: 22px;
    }

    .frase {
      font-family: var(--serif);
      font-size: clamp(16px, 5.4cqw, 21px);
      line-height: 1.35;
      color: var(--acento);
    }

    /* Ayuda bajo la tarjeta */
    .pista {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 18px;
      font-size: 12.5px;
      color: var(--pista);
    }

    .pista .ico {
      font-size: 18px;
      animation: rotar 2.2s ease-in-out infinite;
    }

    @keyframes rotar {

      0%,
      100% {
        rotate: -16deg;
      }

      50% {
        rotate: 16deg;
      }
    }

    /* Burbujas de idioma */
    .selector {
      justify-content: center;
      gap: clamp(24px, 8cqh, 48px);
      padding: 26px 16px 14px;
    }

    .sel-es {
      font-family: var(--serif);
      font-size: clamp(24px, 8.4cqw, 32px);
      line-height: 1.2;
      color: var(--tx);
    }

    .sel-en {
      margin-top: 6px;
      font-size: 13px;
      color: var(--tx2);
    }

    .burbujas {
      display: flex;
      justify-content: center;
      gap: clamp(16px, 7cqw, 34px);
    }

    .burbuja {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: scale .25s cubic-bezier(.3, 1.4, .5, 1);
    }

    .burbuja:active {
      scale: .93;
    }

    .burbuja.cerca {
      scale: 1.12;
    }

    .burbuja-esfera {
      position: relative;
      display: block;
      width: clamp(92px, 33cqw, 132px);
      aspect-ratio: 1;
      border-radius: 50%;
      padding: 4px;
      margin-bottom: 16px;
      background: linear-gradient(150deg, rgba(255, 255, 255, .9), var(--oro) 45%, rgba(255, 255, 255, .35));
      box-shadow: 0 14px 28px var(--sombra-burbuja), 0 2px 6px var(--sombra-burbuja);
      animation: flotar 4.2s ease-in-out infinite;
    }

    .burbuja:last-child .burbuja-esfera {
      animation-delay: -2.1s;
    }

    .burbuja-esfera img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Brillo de burbuja */
    .burbuja-esfera::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(circle at 32% 24%, rgba(255, 255, 255, .85), rgba(255, 255, 255, .18) 22%, transparent 42%),
        radial-gradient(circle at 50% 50%, transparent 58%, rgba(10, 20, 40, .28) 100%);
    }

    @keyframes flotar {

      0%,
      100% {
        translate: 0 -5px;
      }

      50% {
        translate: 0 5px;
      }
    }

    .selector.visible .burbuja {
      animation: brotar .6s cubic-bezier(.3, 1.5, .5, 1) .4s backwards;
    }

    .selector.visible .burbuja:last-child {
      animation-delay: .52s;
    }

    @keyframes brotar {
      from {
        opacity: 0;
        scale: .4;
      }

      to {
        opacity: 1;
        scale: 1;
      }
    }

    .burbuja-nombre {
      font-size: 15.5px;
      font-weight: 500;
      color: var(--tx);
    }

    .burbuja-pais {
      margin-top: 2px;
      font-size: 12px;
      color: var(--tx2);
    }

    /* Contacto */
    .c-cab {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: clamp(20px, 5.500cqh, 36px) 24px 0;
    }

    .c-cab .logo {
      width: clamp(70px, 25cqw, 104px);
    }

    .c-cuerpo {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(4px, 1.6cqh, 14px);
      padding: 6px 24px 8px;
      text-align: left;
      min-height: 0;
    }

    .contacto .fila {
      grid-template-columns: 18px 1fr;
      gap: 13px;
      padding: clamp(7px, 1.6cqh, 13px) 0;
    }

    .contacto .fila span,
    .contacto .fila a {
      font-size: 14.5px;
    }

    .contacto .redes a {
      width: 38px;
      height: 38px;
    }

    @container (max-height:500px) {
      .c-cab .logo {
        display: none;
      }

      .c-cab {
        padding-top: 24px;
      }

      .contacto .fila {
        padding: 5px 0;
      }

      .contacto .fila span,
      .contacto .fila a {
        font-size: 13.5px;
      }

      .contacto .fila b {
        margin-bottom: 1px;
        font-size: 9.5px;
      }
    }

    @media (max-width:768px) {

      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        background: var(--pagina-movil);
        display: block;
        padding: 0;
        min-height: 0;
      }

      body::before {
        display: none;
      }

      .tarjeta {
        display: none !important;
      }

      .movil {
        display: block;
        width: 100%;
        height: 100%;
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition-duration: .01ms !important;
      }
    }

    /* ===== BASE ===== */
    :root {
      --serif: 'Bodoni Moda', Georgia, serif;
      --sans: 'Jost', system-ui, sans-serif;
      --oro: #d4bb76;
      --acento: #d9c17e;
      --sobre-acento: #080f20;
      --pagina: radial-gradient(90% 70% at 50% 40%, #12203c, #060b18 75%);
      --pagina-movil: #060b18;
      --pista: #a9a48f;
      --sombra-carta: 0 0 0 1px rgba(212, 187, 118, .35), 0 30px 60px -18px #000;
      --radio-movil: 4px;
      --sup: #0a1329;
      --cara: radial-gradient(120% 60% at 50% 100%, rgba(212, 187, 118, .13), transparent 62%), #0a1329;
      --tx: #f3efe4;
      --tx2: #98a2b6;
      --linea: rgba(212, 187, 118, .2);
      --activo-bg: linear-gradient(135deg, #e6d591, #ab914f);
      --activo-tx: #0a1329;
      --sombra-burbuja: rgba(0, 0, 0, .6);
      --radio: 3px;
      --reflejo: rgba(212, 187, 118, .09);
    }

    body {
      background-attachment: fixed;
    }

    .tarjeta {
      width: min(1000px, 100%);
      grid-template-columns: 1fr minmax(210px, 250px) 1fr;
      column-gap: 36px;
      align-items: center;
      padding: 46px 54px;
      border: 1px solid var(--oro);
      box-shadow: 0 0 0 7px #0a1329, 0 0 0 8px rgba(212, 187, 118, .3), 0 50px 90px -30px #000;
    }

    .t-marca,
    .t-datos,
    #d-filas {
      display: contents;
    }

    .idiomas {
      grid-column: 1/-1;
      grid-row: 1;
      justify-self: center;
      width: min(390px, 100%);
      margin-bottom: 26px;
    }

    .t-marca .logo {
      grid-column: 2;
      grid-row: 2/4;
      width: 100%;
    }

    #d-filas .fila {
      border: 0;
      padding: 14px 0;
    }

    #d-filas .fila:nth-child(1) {
      grid-column: 1;
      grid-row: 2;
    }

    #d-filas .fila:nth-child(2) {
      grid-column: 1;
      grid-row: 3;
    }

    #d-filas .fila:nth-child(3) {
      grid-column: 3;
      grid-row: 2;
    }

    #d-filas .fila:nth-child(4) {
      grid-column: 3;
      grid-row: 3;
    }

    /* Columna izquierda en espejo */
    #d-filas .fila:nth-child(-n+2) {
      grid-template-columns: 1fr 20px;
      text-align: right;
    }

    #d-filas .fila:nth-child(-n+2) .ico {
      order: 2;
    }

    .lema {
      grid-column: 1/-1;
      grid-row: 4;
      margin-top: 26px;
      font-size: 14px;
      letter-spacing: .24em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ab914f, #e9da9a 50%, #ab914f);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-align: center;
    }

    .t-marca .redes {
      grid-column: 1/-1;
      grid-row: 5;
      justify-self: center;
      margin-top: 18px;
    }

    .fila b {
      color: var(--acento);
    }

    .cara::before {
      content: '';
      position: absolute;
      inset: 9px;
      border: 1px solid var(--oro);
      pointer-events: none;
    }

    .cara::after {
      content: '';
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(212, 187, 118, .28);
      pointer-events: none;
    }

    .frase {
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      line-height: 1.9;
      max-width: 230px;
    }

    .linea {
      width: 96px;
      background: linear-gradient(90deg, transparent, var(--oro), transparent);
    }

    .sel-es {
      font-weight: 400;
    }

    .c-cuerpo {
      padding-left: 30px;
      padding-right: 30px;
      padding-bottom: 22px;
    }

    .c-cab {
      padding-top: clamp(26px, 6cqh, 40px);
    }

    @media (max-width:900px) and (min-width:769px) {
      .tarjeta {
        padding: 36px 30px;
        column-gap: 20px;
        grid-template-columns: 1fr 170px 1fr;
      }
    }

    /* ===== INTRO: PRESENTACIÓN DEL LOGO ===== */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      /* Seguro: si el script fallara, la intro nunca tapa la tarjeta */
      animation: intro-seguro .01s linear 7s forwards;
    }

    @keyframes intro-seguro {
      to {
        visibility: hidden;
      }
    }

    .intro-fondo {
      position: absolute;
      inset: 0;
      background: var(--intro-fondo);
    }

    .intro-logo {
      position: relative;
      width: min(78vw, 68vh, 440px);
    }

    .intro-svg {
      position: relative;
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .intro-svg * {
      transform-box: fill-box;
      transform-origin: center;
    }

    .intro-halo {
      position: absolute;
      left: 49.1%;
      top: 33.7%;
      width: 110%;
      aspect-ratio: 1;
      margin: -55% 0 0 -55%;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(255, 255, 255, .16), rgba(255, 255, 255, .05) 55%, transparent);
      opacity: 0;
    }

    .intro-cierre {
      position: absolute;
      top: 100%;
      left: 50%;
      width: max-content;
      max-width: 88vw;
      transform: translateX(-50%);
      padding-top: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    .intro-frase span {
      display: inline-block;
    }

    @media (max-height:460px) {
      .intro-cierre {
        display: none;
      }
    }

    /* Mientras dura la intro, la tarjeta espera sin su logo */
    body[data-intro] .tarjeta {
      animation: none;
    }

    body[data-intro="activa"] .t-marca .logo,
    body[data-intro="activa"] .frente .logo {
      visibility: hidden;
    }

    @media (prefers-reduced-motion:reduce) {
      #intro {
        display: none;
      }
    }

    /* ===== MÓVIL: SOLO LA TARJETA, A PANTALLA COMPLETA ===== */
    @media (max-width:768px) {
      .escena {
        gap: 0;
        padding: 0;
      }

      .inclina {
        width: 100%;
        height: 100%;
      }

      .inclina.sin-giro {
        animation: none;
      }

      .cara {
        border-radius: 0;
        box-shadow: none;
      }

      .pista {
        display: none;
      }

      /* Reflejo dorado, igual que el que sigue al ratón en PC */
      .inclina {
        --brillo: rgba(212, 187, 118, .24);
      }

      .brillo {
        background: radial-gradient(280px circle at var(--bx) var(--by), var(--brillo), transparent 70%);
      }

      /* El reverso está girado: se invierte para que el reflejo vaya al mismo lado */
      .dorso .brillo {
        background: radial-gradient(280px circle at calc(100% - var(--bx)) var(--by), var(--brillo), transparent 70%);
      }
    }
  
    .intro-frase {
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      line-height: 1.9;
      max-width: 240px;
      font-style: normal;
    }

    /* ===== NOCHE Y ORO · ART DÉCO ===== */
    :root {
      --serif: 'Cinzel', Georgia, serif;
      --sans: 'Jost', system-ui, sans-serif;
      --intro-fondo: #060b18;
      --cara: repeating-conic-gradient(from 150deg at 50% 0%, rgba(212, 187, 118, .1) 0 2deg, transparent 2deg 10deg) top / 100% 44% no-repeat, #0a1329;
    }

    .tarjeta {
      border: 0;
      outline: 1px solid var(--oro);
      outline-offset: -12px;
      box-shadow: 0 50px 90px -30px #000;

      inset: 16px;
      border: 0;
      --o: var(--oro);
      background:

        linear-gradient(var(--o), var(--o)) left top / 1px 54px no-repeat,
        linear-gradient(var(--o), var(--o)) right top / 54px 1px no-repeat,
        linear-gradient(var(--o), var(--o)) right top / 1px 54px no-repeat,
        linear-gradient(var(--o), var(--o)) left bottom / 54px 1px no-repeat,
        linear-gradient(var(--o), var(--o)) left bottom / 1px 54px no-repeat,
        linear-gradient(var(--o), var(--o)) right bottom / 54px 1px no-repeat,
        linear-gradient(var(--o), var(--o)) right bottom / 1px 54px no-repeat;
    }

    .cara::after {
      display: none;
    }

    .dorso {
      background: #0a1329;
    }

    .p-marca {
      margin-top: clamp(90px, 24cqh, 210px);
    }

    .frente .logo {
      width: 60cqw;
    }

    .p-texto {
      margin-top: auto;
      margin-bottom: clamp(64px, 12cqh, 104px);
    }

    .frente .frase {
      font-size: clamp(14px, 4.4cqw, 17px);
      letter-spacing: .14em;
      line-height: 1.7;
      max-width: 270px;
    }

    .contacto .fila {
      grid-template-columns: 1fr;
      justify-items: center;
      text-align: center;
      gap: 5px;
      border-bottom: 0;
    }

    .contacto .redes {
      margin-top: 6px;
    }

    .intro-foco {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 260vmax;
      height: 260vmax;
      margin: -130vmax 0 0 -130vmax;
      background: radial-gradient(circle, rgba(217, 193, 126, .13) 0, rgba(217, 193, 126, .05) 8vmax, #060b18 22vmax);
    }

    @media (max-width:768px) {
      .inclina {
        --brillo: rgba(212, 187, 118, .24);
      }
    }
  

    /* ===== GUÍA DE TOQUE (solo móvil): una línea de luz en cada borde ===== */
    .guia {
      display: none;
    }

    @media (max-width:768px) {
      .escena {
        position: relative;
      }

      .guia {
        --guia-izq: #d9c17e;
        --guia-der: #d9c17e;
        display: block;
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        opacity: 0;
        transition: opacity .25s ease;
      }

      .guia[data-estado="contacto"] {
        --guia-izq: #d9c17e;
        --guia-der: #d9c17e;
      }

      .guia.visible {
        opacity: 1;
        transition: opacity .6s ease 1s;
      }

      body[data-intro="activa"] .guia {
        opacity: 0;
      }

      .guia-toque {
        --c: var(--guia-izq);
        --mov: 3px;
        position: absolute;
        top: 50%;
        left: 6px;
        width: 4px;
        height: 130px;
        margin-top: -65px;
        border-radius: 4px;
        background: linear-gradient(180deg, transparent, var(--c) 18%, var(--c) 82%, transparent);
        filter: drop-shadow(0 0 5px var(--c));
        opacity: .45;
        animation: guia-luz 3.2s ease-in-out infinite;
      }

      .guia-toque:last-child {
        --c: var(--guia-der);
        --mov: -3px;
        left: auto;
        right: 6px;
        animation-delay: 1.6s;
      }
    }

    @keyframes guia-luz {
      0%, 50%, 100% {
        opacity: .45;
        translate: 0 0;
      }

      18% {
        opacity: 1;
        translate: var(--mov) 0;
      }
    }

  </style>
</head>

 <script>
         /* ================= DATOS (edita aquí) ================= */
    const redes = { whatsapp: "#", facebook: "#", instagram: "#", linkedin: "#" };

    const textos = {
      es: {
        pais: "México · Español",
        lema: "Su seguridad, nuestro compromiso",
        dir: "Dirección", dirVal: "Av. Reforma #123, Puebla, México",
        tel: "Teléfonos", telVal: [["222 123 4567", "+522221234567"], ["222 765 4321", "+522227654321"]],
        correo: "Correo", correoVal: "contacto@grupocarma.com",
        horario: "Horario", horarioVal: "Lun - Vie 9:00 - 18:00"
      },
      en: {
        pais: "Canada · English",
        lema: "Your security, our commitment",
        dir: "Address", dirVal: "123 Reforma Ave, Puebla, Mexico",
        tel: "Phone", telVal: [["+52 222 123 4567", "+522221234567"]],
        correo: "Email", correoVal: "contacto@grupocarma.com",
        horario: "Hours", horarioVal: "Mon - Fri 9:00 AM - 6:00 PM"
      }
    };

    /* ================= RELLENO ================= */
    const clonar = id => document.getElementById(id).content.cloneNode(true);

    function llenar(raiz, t) {
      raiz.querySelectorAll('[data-t]').forEach(el => el.textContent = t[el.dataset.t]);
      raiz.querySelectorAll('[data-tel]').forEach(el => {
        el.textContent = '';
        t.telVal.forEach(([texto, numero], i) => {
          if (i) el.append(' / ');
          const a = document.createElement('a');
          a.href = 'tel:' + numero;
          a.textContent = texto;
          el.append(a);
        });
      });
      raiz.querySelectorAll('[data-correo]').forEach(el => {
        el.textContent = t.correoVal;
        el.href = 'mailto:' + t.correoVal;
      });
    }

    function ponerRedes(raiz) {
      raiz.querySelectorAll('[data-redes]').forEach(el => {
        el.append(clonar('tpl-redes'));
        el.querySelectorAll('[data-red]').forEach(a => {
          a.href = redes[a.dataset.red];
          if (a.getAttribute('href') !== '#') { a.target = '_blank'; a.rel = 'noopener'; }
        });
      });
    }

    const sinMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ================= PC ================= */
    const tarjeta = document.getElementById('tarjeta');
    document.getElementById('d-filas').append(clonar('tpl-filas'));
    ponerRedes(tarjeta);

    function marcarIdioma(idioma) {
      tarjeta.querySelectorAll('[data-idioma]').forEach(b => {
        b.setAttribute('aria-pressed', b.dataset.idioma === idioma);
      });
    }
    function pintarDesktop(idioma) {
      const t = textos[idioma];
      llenar(tarjeta, t);
      document.getElementById('d-lema').textContent = t.lema;
      document.documentElement.lang = idioma;
      marcarIdioma(idioma);
    }

    let idiomaDesktop = 'es', tCambio;
    function cambiarIdiomaDesktop(idioma) {
      if (idioma === idiomaDesktop) return;
      idiomaDesktop = idioma;
      clearTimeout(tCambio);
      tarjeta.classList.add('cambiando');
      marcarIdioma(idioma);
      tCambio = setTimeout(() => {
        pintarDesktop(idioma);
        tarjeta.classList.remove('cambiando');
      }, sinMovimiento ? 0 : 180);
    }
    tarjeta.querySelectorAll('[data-idioma]').forEach(b => {
      b.addEventListener('click', () => cambiarIdiomaDesktop(b.dataset.idioma));
    });
    pintarDesktop('es');

    /* Inclinación sutil de la tarjeta al mover el ratón */
    if (document.body.dataset.inclinar !== undefined && !sinMovimiento &&
      window.matchMedia('(hover:hover) and (pointer:fine)').matches) {
      tarjeta.addEventListener('pointermove', e => {
        const r = tarjeta.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        tarjeta.style.setProperty('--rx', ((.5 - y) * 3).toFixed(2) + 'deg');
        tarjeta.style.setProperty('--ry', ((x - .5) * 3).toFixed(2) + 'deg');
        tarjeta.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
        tarjeta.style.setProperty('--my', (y * 100).toFixed(1) + '%');
      });
      tarjeta.addEventListener('pointerleave', () => {
        tarjeta.style.setProperty('--rx', '0deg');
        tarjeta.style.setProperty('--ry', '0deg');
      });
    }

    /* ================= MÓVIL ================= */
    const inclina = document.getElementById('inclina');
    const carta = document.getElementById('carta');
    const portada = document.getElementById('portada');
    const dorso = document.getElementById('dorso');
    const selector = document.getElementById('selector');
    const contacto = document.getElementById('contacto');
    const burbujas = {};
    document.querySelectorAll('[data-elegir]').forEach(b => burbujas[b.dataset.elegir] = b);

    let estado = 'portada';       // portada | selector | contacto
    let sentido = 1;              // hacia qué lado se volteó la tarjeta
    let idiomaMovil = null;
    let esperarCentro = false;    
    let cambiando = false;

    document.getElementById('m-filas').append(clonar('tpl-filas'));
    ponerRedes(contacto);

    function aplicar() {
      carta.style.transform = `rotateY(${anguloBase()}deg)`;
      carta.dataset.estado = estado;
      portada.inert = estado !== 'portada';
      contacto.inert = estado !== 'contacto';
      selector.classList.toggle('visible', estado === 'selector');
      contacto.classList.toggle('visible', estado === 'contacto');
      pintarPista();
      esperarGuia();
    }

    function vibrar() { if (navigator.vibrate) navigator.vibrate(30); }

    function voltear(nuevoSentido = 1) {
      sentido = nuevoSentido;
      estado = 'selector';
      aplicar();
      vibrar();
    }

    function aPortada() {
      esperarCentro = true;
      estado = 'portada';
      aplicar();
      marcarCerca(null);
      vibrar();
    }

    function elegir(idioma) {
      idiomaMovil = idioma;
      llenar(contacto, textos[idioma]);
      contacto.lang = idioma;
      esperarCentro = true;   
      estado = 'contacto';
      aplicar();
      marcarCerca(null);
    }

    function elegirDirecto(idioma) {
      idiomaMovil = idioma;
      llenar(contacto, textos[idioma]);
      contacto.lang = idioma;
      esperarCentro = true;
      estado = 'contacto'; 
      aplicar();
      marcarCerca(null);
      vibrar();
    }

    /* Cambia de idioma dando la vuelta completa a la tarjeta */
    function cambiarIdiomaMovil(idioma, giro) {
      if (idioma === idiomaMovil || cambiando) return;
      vibrar();
      if (sinMovimiento) { elegir(idioma); esperarCentro = false; return; }
      cambiando = true;
      const base = anguloBase();
      const paso = (de, a, easing, ms) => carta.animate(
        [{ transform: `rotateY(${de}deg)` }, { transform: `rotateY(${a}deg)` }],
        { duration: ms, easing }
      );
      paso(base, base + 90 * giro, 'ease-in', 240).onfinish = () => {
        idiomaMovil = idioma;
        llenar(contacto, textos[idioma]);
        contacto.lang = idioma;
        pintarPista();
        paso(base - 90 * giro, base, 'cubic-bezier(.2,.8,.2,1)', 420).onfinish = () => { cambiando = false; };
      };
    }

    /* ---------- Control Táctil por Lados e Idiomas ---------- */
    let x0 = null, y0 = null;
    const escena = document.getElementById('escena');

    escena.addEventListener('touchstart', e => { 
      x0 = e.touches[0].clientX; 
      y0 = e.touches[0].clientY; 
    }, { passive: true });

    escena.addEventListener('touchend', e => {
      if (x0 === null) return;
      
      const x1 = e.changedTouches[0].clientX;
      const y1 = e.changedTouches[0].clientY;
      const dx = x1 - x0;
      const dy = y1 - y0;
      x0 = null;

      // 1. Si el usuario realiza un DESLIZAMIENTO (Swipe) horizontal:
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        const haciaDerecha = dx > 0;
        if (estado === 'selector') { aPortada(); return; }
        if (estado === 'portada') {
          voltear(haciaDerecha ? 1 : -1);
        } else if (estado === 'contacto') {
          cambiarIdiomaMovil(haciaDerecha ? 'es' : 'en', haciaDerecha ? -1 : 1);
        }
        return; 
      }

      // 2. Si es un TOQUE SIMPLE (Tap):
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
        // Teléfono, correo y redes solo abren su enlace, sin mover la tarjeta
        if (e.target.closest('a')) return;

        // En el selector, tocar fuera de las banderas regresa al logo
        if (estado === 'selector') {
          if (!e.target.closest('.burbuja')) aPortada();
          return;
        }

        // Obtenemos dimensiones basándonos en la tarjeta visible actualmente
        const elementoActivo = estado === 'portada' ? portada : dorso;
        const dimensiones = elementoActivo.getBoundingClientRect();
        const puntoDelToque = x1 - dimensiones.left;
        const mitad = dimensiones.width / 2;
        const ladoTocado = puntoDelToque < mitad ? 'es' : 'en';

        if (estado === 'portada') {
          // Si está en la portada, va directo al idioma del lado presionado
          sentido = ladoTocado === 'es' ? -1 : 1;
          elegirDirecto(ladoTocado);
        } else if (estado === 'contacto') {
          // Si está en los datos y toca el lado correspondiente al idioma activo, regresa al logo
          if (ladoTocado === idiomaMovil) {
            aPortada();
          } else {
            // Si toca el lado opuesto, cambia de idioma con animación de giro
            cambiarIdiomaMovil(ladoTocado, ladoTocado === 'es' ? -1 : 1);
          }
        }
      }
    }, { passive: true });

    /* ---------- Lógica Auxiliar de Estado y Renderizado ---------- */
    function anguloBase() {
      return estado === 'portada' ? 0 : 180 * sentido;
    }

    function marcarCerca(idioma) {
      Object.entries(burbujas).forEach(([k, b]) => {
        b.classList.toggle('cerca', k === idioma);
      });
    }

    Object.values(burbujas).forEach(b => {
      b.addEventListener('click', () => elegir(b.dataset.elegir));
    });
    

    /* ---------- Texto de ayuda bajo la tarjeta ---------- */
    const pista = document.getElementById('pista');

    /* ---------- Guía de toque: se apaga al tocar y vuelve tras unos segundos sin tocar ---------- */
    const guia = document.getElementById('guia');
    let tGuia;
    function mostrarGuia() {
      guia.dataset.estado = estado;
      guia.classList.toggle('visible', estado !== 'selector');
    }
    function esperarGuia() {
      guia.classList.remove('visible');
      clearTimeout(tGuia);
      tGuia = setTimeout(mostrarGuia, 4000);
    }
    escena.addEventListener('touchstart', esperarGuia, { passive: true });
    mostrarGuia();
    const pistaTxt = document.getElementById('pista-txt');

    function pintarPista() {
      if (estado === 'portada') pistaTxt.textContent = 'Toca o desliza · Tap or swipe';
      else if (estado === 'selector') pistaTxt.textContent = 'Elige una bandera · Pick a flag';
      else pistaTxt.textContent = idiomaMovil === 'en' ? 'Swipe to change language' : 'Desliza para cambiar de idioma';
    }
    pintarPista();

    let giroActivo = false;      
    let sinGiro = false;         
    let faltaPermiso = false;

    /* ---------- Reflejo que sigue la inclinación del teléfono ---------- */
    function activarGiro() {
      if (giroActivo) return;
      giroActivo = true;

      const limitar = (v, min, max) => Math.min(max, Math.max(min, v));
      let gamma0 = null, beta0 = null;   // posición de reposo de la mano
      let metaX = 50, metaY = 30, x = 50, y = 30, pintando = false;

      function pintar() {
        x += (metaX - x) * .15;
        y += (metaY - y) * .15;
        inclina.style.setProperty('--bx', x.toFixed(1) + '%');
        inclina.style.setProperty('--by', y.toFixed(1) + '%');
        if (Math.abs(metaX - x) + Math.abs(metaY - y) > .1) requestAnimationFrame(pintar);
        else pintando = false;
      }

      window.addEventListener('deviceorientation', e => {
        if (e.gamma === null || e.beta === null) return;
        if (gamma0 === null || Math.abs(e.gamma - gamma0) > 60 || Math.abs(e.beta - beta0) > 60) {
          gamma0 = e.gamma;
          beta0 = e.beta;
        }
        /* El reposo se adapta poco a poco a como se sostiene el teléfono */
        gamma0 += (e.gamma - gamma0) * .003;
        beta0 += (e.beta - beta0) * .003;
        metaX = limitar(50 + (e.gamma - gamma0) * 2.4, 0, 100);
        metaY = limitar(30 + (e.beta - beta0) * 2.4, 0, 100);
        if (!pintando) { pintando = true; requestAnimationFrame(pintar); }
      });
    }

    if (!sinMovimiento && window.DeviceOrientationEvent) {
      faltaPermiso = typeof DeviceOrientationEvent.requestPermission === 'function';
      if (!faltaPermiso) activarGiro();
      else {
        /* iPhone solo deja pedir el permiso dentro de un toque */
        let pidiendo = false;
        const pedirGiro = () => {
          if (pidiendo) return;
          pidiendo = true;
          DeviceOrientationEvent.requestPermission().then(respuesta => {
            pidiendo = false;
            if (respuesta !== 'granted') return;   // se reintenta en el siguiente toque
            faltaPermiso = false;
            document.removeEventListener('touchend', pedirGiro);
            activarGiro();
          }).catch(() => { pidiendo = false; });
        };
        document.addEventListener('touchend', pedirGiro, { passive: true });
        pedirGiro();   // otros navegadores lo conceden sin esperar el toque
      }
    }    


 </script>

  <script>
    /* ================= INTRO DEL LOGO =================
       Usa el mismo SVG de --logo, separado por piezas, y al terminar
       lo lleva hasta el lugar exacto del logo en la tarjeta.
       Los tiempos están en milisegundos. */
    (() => {
      const intro = document.getElementById('intro');
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { intro.remove(); return; }

      const quitar = () => { document.body.dataset.intro = 'fin'; intro.remove(); };
      document.body.dataset.intro = 'activa';
      intro.style.animation = 'none';   // con script, la intro se quita sola al terminar

      try {
        const caja = intro.querySelector('.intro-logo');
        const halo = intro.querySelector('.intro-halo');
        const fondo = intro.querySelector('.intro-fondo');
        const cierre = intro.querySelector('.intro-cierre');
        const linea = intro.querySelector('.intro-linea');
        const palabras = [...intro.querySelectorAll('.intro-frase span')];
        const NS = 'http://www.w3.org/2000/svg';
        const crear = (tag, attrs) => {
          const el = document.createElementNS(NS, tag);
          Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
          return el;
        };

        const b64 = getComputedStyle(document.documentElement).getPropertyValue('--logo').match(/base64,([^'")\s]+)/)[1];
        const svg = document.importNode(new DOMParser().parseFromString(atob(b64), 'image/svg+xml').documentElement, true);
        svg.classList.add('intro-svg');
        (caja.querySelector('.intro-marco') || caja).append(svg);

        /* Piezas del logo, en el orden en que vienen en el SVG */
        const raiz = svg.querySelector('g');
        const piezas = [...raiz.children];
        const carma = piezas.slice(0, 6);
        const grupo = piezas.slice(6, 11);
        const medalla = piezas[11];
        const aro = piezas[12];
        const monograma = piezas.slice(13, 15);
        const lema = [...piezas[15].children];
        const contorno = medalla.querySelector('path').getAttribute('d');

        /* El centro de la medalla: su recorte interno descuadra el cálculo automático */
        medalla.style.transformBox = 'view-box';
        medalla.style.transformOrigin = '333px 196px';
        aro.setAttribute('pathLength', 1);
        aro.setAttribute('stroke-dasharray', 1);

        const animaciones = [];
        const lento = 'cubic-bezier(.22,.61,.36,1)';
        const animar = (el, cuadros, retraso, duracion, curva = lento) => {
          const animacion = el.animate(cuadros, { delay: retraso, duration: duracion, easing: curva, fill: 'both' });
          animaciones.push(animacion);
          return animacion;
        };
        const aparecer = [{ opacity: 0 }, { opacity: 1 }];
        const desaparecer = [{ opacity: 1 }, { opacity: 0 }];
        const dibujar = [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }];
        const fundir = (lista, inicio, paso, duracion) => {
          lista.forEach((el, i) => animar(el, aparecer, inicio + i * paso, duracion, 'ease'));
        };
        const lemaFinal = (inicioLinea, inicioPalabras) => {
          animar(linea, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], inicioLinea, 800);
          fundir(palabras, inicioPalabras, 120, 800);
        };

        /* Reflejo tenue que cruza la medalla */
        const reflejo = (inicio, duracion) => {
          const defs = crear('defs', {});
          const recorte = crear('clipPath', { id: 'intro-disco' });
          recorte.append(crear('path', { d: contorno }));
          const luz = crear('linearGradient', { id: 'intro-luz' });
          [[0, 0], [.5, .35], [1, 0]].forEach(([offset, alfa]) => {
            luz.append(crear('stop', { offset, 'stop-color': '#fff', 'stop-opacity': alfa }));
          });
          defs.append(recorte, luz);
          const marcoLuz = crear('g', { 'clip-path': 'url(#intro-disco)' });
          const banda = crear('rect', { x: 0, y: 0, width: 130, height: 400, fill: 'url(#intro-luz)' });
          marcoLuz.append(banda);
          raiz.append(defs, marcoLuz);
          animar(banda, [
            { transform: 'translateX(-60px) skewX(-18deg)' },
            { transform: 'translateX(560px) skewX(-18deg)' }
          ], inicio, duracion, 'ease-in-out');
        };

        /* FOCO: un haz de luz recorre la oscuridad, descubre el logo y se abre */
        const FIN = 5800;
        const foco = intro.querySelector('.intro-foco');
        animar(foco, [
          { transform: 'translate(-70vw,-24vh)' },
          { transform: 'translate(38vw,14vh)', offset: .55 },
          { transform: 'none' }
        ], 200, 2500, 'ease-in-out');
        animar(foco, desaparecer, 2800, 1100, 'ease');
        animar(halo, [{ opacity: 0 }, { opacity: .7, offset: .4 }, { opacity: 0 }], 2600, 2800, 'ease-in-out');
        reflejo(3100, 1300);
        lemaFinal(3700, 3950);

        const reloj = animar(caja, [{ opacity: 1 }, { opacity: 1 }], 0, FIN, 'linear');

        /* ---------- Sonido, generado aquí mismo (sin archivos de audio) ---------- */
        function crearSonido() {
          const Contexto = window.AudioContext || window.webkitAudioContext;
          if (!Contexto) return null;
          const ctx = new Contexto();

          const maestro = ctx.createGain();
          const limitador = ctx.createDynamicsCompressor();
          maestro.gain.value = 1;
          limitador.threshold.value = -12;
          limitador.knee.value = 6;
          limitador.ratio.value = 6;
          limitador.attack.value = .005;
          limitador.release.value = .25;
          maestro.connect(limitador);
          limitador.connect(ctx.destination);

          /* Eco de sala */
          const sala = ctx.createConvolver();
          const calidez = ctx.createBiquadFilter();
          calidez.type = 'lowpass';
          calidez.frequency.value = 4200;
          const largo = Math.floor(ctx.sampleRate * 2.4);
          const respuesta = ctx.createBuffer(2, largo, ctx.sampleRate);
          for (let canal = 0; canal < 2; canal++) {
            const datos = respuesta.getChannelData(canal);
            for (let i = 0; i < largo; i++) datos[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / largo, 3);
          }
          sala.buffer = respuesta;
          sala.connect(calidez);
          calidez.connect(maestro);

          const nota = (f, t, dur, { tipo = 'sine', vol = .1, ataque = .01, eco = .3 } = {}) => {
            const osc = ctx.createOscillator(), env = ctx.createGain(), envio = ctx.createGain();
            osc.type = tipo;
            osc.frequency.value = f;
            env.gain.setValueAtTime(.0001, t);
            env.gain.exponentialRampToValueAtTime(vol, t + ataque);
            env.gain.exponentialRampToValueAtTime(.0001, t + dur);
            envio.gain.value = eco;
            osc.connect(env);
            env.connect(maestro);
            env.connect(envio);
            envio.connect(sala);
            osc.start(t);
            osc.stop(t + dur + .02);
          };

          /* Piano suave: la nota y unos pocos armónicos que se apagan antes */
          const tecla = (f, t, vol, dur = 3) => {
            [[1, 1], [2, .32], [3, .1], [4, .04]].forEach(([k, a], i) => {
              nota(f * k, t, dur / (1 + i * .7), { vol: vol * a, ataque: .012, eco: .45 });
            });
          };
          const acorde = (notas, t, vol) => notas.forEach((f, i) => tecla(f, t + i * .03, vol, 3.4));
          /* La melodía va doblada a la octava: el altavoz del teléfono casi no da graves */
          const melodia = (f, t, vol, dur = 3) => {
            tecla(f, t, vol, dur);
            tecla(f * 2, t, vol * .55, dur * .8);
          };
          /* Cuerdas: dos osciladores apenas desafinados por nota, muy filtrados */
          const cuerdas = (notas, t, dur, vol, ataque) => {
            const filtro = ctx.createBiquadFilter(), env = ctx.createGain(), envio = ctx.createGain();
            const entrada = Math.min(ataque, dur / 3), salida = Math.min(.9, dur / 3);
            filtro.type = 'lowpass';
            filtro.frequency.value = 1800;
            env.gain.setValueAtTime(0, t);
            env.gain.linearRampToValueAtTime(vol, t + entrada);
            env.gain.setValueAtTime(vol, t + dur - salida);
            env.gain.linearRampToValueAtTime(0, t + dur);
            envio.gain.value = .5;
            filtro.connect(env);
            env.connect(maestro);
            env.connect(envio);
            envio.connect(sala);
            notas.forEach(f => [-4, 4].forEach(desafino => {
              const osc = ctx.createOscillator();
              osc.type = 'sawtooth';
              osc.frequency.value = f;
              osc.detune.value = desafino;
              osc.connect(filtro);
              osc.start(t);
              osc.stop(t + dur + .02);
            }));
          };

          /* "desde" permite entrar a mitad de la intro; lo último siempre suena */
          function programar(desde) {
            const base = ctx.currentTime + .06, en = ms => base + (ms - desde) / 1000;
            const cuando = (ms, tocar) => { if (ms >= desde) tocar(en(ms)); };
            const alFinal = ms => en(Math.max(ms, desde));
            /* Cuerdas en la penumbra, dos notas y un acorde cuando se hace la luz */
            const pasaje = Math.max(0, desde);
            if (pasaje < 5800) cuerdas([220, 329.63], en(pasaje), (5800 - pasaje) / 1000, .05, 2);
            cuando(700, t => melodia(329.63, t, .18));
            cuando(1900, t => melodia(440, t, .2));
            const final = alFinal(3000);
            acorde([110, 220, 329.63, 554.37], final, .15);
            melodia(659.25, final + .1, .27, 4.4);
          }

          /* El navegador decide cuándo deja sonar: con permiso, arranca al cargar;
             sin él, el primer toque lo enciende, aunque la intro ya haya terminado */
          let programado = false, inicio = 0, terminada = false;
          const eventos = ['click', 'touchend', 'keydown'];
          const cerrar = () => { if (ctx.close) ctx.close().catch(() => { }); };
          const empezar = () => {
            if (programado || ctx.state !== 'running') return;
            programado = true;
            inicio = performance.now();
            eventos.forEach(ev => document.removeEventListener(ev, despertar, true));
            programar(reloj.currentTime || 0);
            if (terminada) setTimeout(cerrar, 6000);
          };
          function despertar() {
            const r = ctx.resume();
            if (r) r.then(empezar, () => { });
          }
          ctx.onstatechange = empezar;
          eventos.forEach(ev => document.addEventListener(ev, despertar, { capture: true, passive: true }));

          return {
            despertar,
            /* Para que el mismo toque que enciende el sonido no salte la intro */
            recienEncendido: () => !programado || performance.now() - inicio < 500,
            callar(segundos) {
              if (!programado) { terminada = true; return; }
              const ahora = ctx.currentTime;
              maestro.gain.cancelScheduledValues(ahora);
              maestro.gain.setValueAtTime(maestro.gain.value, ahora);
              maestro.gain.linearRampToValueAtTime(0, ahora + segundos);
              setTimeout(cerrar, segundos * 1000 + 100);
            }
          };
        }

        let sonido = null, saltada = false;
        try { sonido = crearSonido(); } catch (e) { sonido = null; }
        if (sonido) sonido.despertar();

        function salir() {
          if (sonido) sonido.callar(saltada ? .35 : 1.4);
          cierre.animate(desaparecer, { duration: 300, easing: 'ease', fill: 'forwards' });
          const destino = [...document.querySelectorAll('.t-marca .logo, .frente .logo')].find(l => l.offsetWidth);
          if (!destino) return quitar();
          const a = caja.getBoundingClientRect(), b = destino.getBoundingClientRect();
          const dx = b.left + b.width / 2 - a.left - a.width / 2;
          const dy = b.top + b.height / 2 - a.top - a.height / 2;
          fondo.animate(desaparecer, { duration: 1000, easing: 'ease', fill: 'forwards' });
          caja.animate(
            [{ transform: 'none' }, { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + (b.width / a.width) + ')' }],
            { duration: 1100, easing: 'cubic-bezier(.65,0,.15,1)', fill: 'forwards' }
          ).finished.then(quitar, quitar);
        }

        Promise.all(animaciones.map(a => a.finished)).then(salir, quitar);
        intro.addEventListener('click', () => {
          /* Si el audio seguía bloqueado, el primer toque lo enciende; si no, salta la intro */
          if (sonido && sonido.recienEncendido()) { sonido.despertar(); return; }
          saltada = true;
          animaciones.forEach(a => a.finish());
        });
      } catch (e) {
        quitar();
      }
    })();
  </script>
</body>
