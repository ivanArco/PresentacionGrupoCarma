*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:var(--sans); background:var(--pagina); color:var(--tx);
  min-height:100vh; min-height:100dvh; display:grid; place-items:center;
  padding:clamp(20px,4vw,48px); -webkit-font-smoothing:antialiased;
}
a{ color:inherit; text-decoration:none; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
ul{ list-style:none; }
:focus-visible{ outline:2px solid var(--acento); outline-offset:3px; border-radius:4px; }
.ico{ width:1em; height:1em; flex:none; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
.ico-marca{ fill:currentColor; stroke:none; }
.logo{ background:var(--logo) center/contain no-repeat; aspect-ratio:678/582; }

/* ===== Elementos comunes ===== */
.filas{ width:100%; transition:opacity .18s ease; }
.fila{ display:grid; grid-template-columns:20px 1fr; gap:16px; align-items:start; padding:15px 0; border-bottom:1px solid var(--linea); }
.fila:last-child{ border-bottom:0; }
.fila > .ico{ font-size:19px; color:var(--acento); margin-top:2px; }
.fila > div{ min-width:0; }
.fila b{ display:block; font-size:10.5px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--tx2); margin-bottom:4px; }
.fila span, .fila a{ font-size:15.5px; line-height:1.45; color:var(--tx); overflow-wrap:anywhere; }
.fila > div > a, .fila > div > span{ display:block; }
.fila a{ text-decoration:underline; text-decoration-color:transparent; text-underline-offset:3px; transition:text-decoration-color .2s; }
.fila a:hover{ text-decoration-color:var(--acento); }

.redes{ display:flex; gap:10px; }
.redes a{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-size:15px; color:var(--tx); border:1px solid var(--linea); transition:background .2s, color .2s, border-color .2s; }
.redes a:hover{ background:var(--acento); border-color:var(--acento); color:var(--sobre-acento); }

/* ===== ESCRITORIO ===== */
.tarjeta{
  width:min(920px,100%); display:grid; grid-template-columns:5fr 7fr; position:relative;
  background:var(--sup); border-radius:var(--radio,16px); overflow:hidden;
  transform:perspective(1400px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .35s ease-out; animation:entrar .7s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes entrar{ from{ opacity:0; translate:0 14px; } to{ opacity:1; translate:0 0; } }
.t-marca{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:22px; padding:44px 36px; }
.t-marca .logo{ width:min(240px,100%); }
.lema{ font-family:var(--serif); font-size:17px; line-height:1.4; color:var(--acento); transition:opacity .18s ease; }
.t-datos{ padding:40px 44px; display:flex; flex-direction:column; justify-content:center; gap:18px; }
.cambiando .filas, .cambiando .lema{ opacity:0; }

.idiomas{ display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; border:1px solid var(--linea); border-radius:999px; }
.idiomas button{ display:flex; align-items:center; justify-content:center; gap:8px; min-height:40px; padding:6px 12px; border-radius:999px; font-size:13px; font-weight:500; color:var(--tx2); transition:background .25s, color .25s; white-space:nowrap; }
.idiomas button:hover{ color:var(--tx); }
.idiomas button[aria-pressed="true"]{ background:var(--activo-bg); color:var(--activo-tx); }
.idiomas img{ width:18px; height:18px; border-radius:50%; object-fit:cover; flex:none; }

/* Reflejo que sigue al ratón */
body[data-inclinar] .tarjeta::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%), var(--reflejo,rgba(255,255,255,.07)), transparent 70%);
}

/* ===== MÓVIL: TARJETA QUE SE VOLTEA ===== */
.movil{ display:none; }
.escena{
  --w:min(88vw,400px);
  width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; perspective:1200px; touch-action:pan-y; padding:12px 0;
}
.inclina{
  --bx:50%; --by:30%;
  width:var(--w); height:min(calc(100dvh - 92px), calc(var(--w) * 1.62));
  transform-style:preserve-3d; transition:transform .18s linear;
}
.inclina.sin-giro{ animation:mecer 6s ease-in-out infinite; }
@keyframes mecer{ 0%,100%{ transform:rotateY(-5deg) rotateX(2deg); } 50%{ transform:rotateY(5deg) rotateX(-1deg); } }
.carta{
  width:100%; height:100%; position:relative; transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(.2,.8,.2,1);
}
.cara{
  position:absolute; inset:0; overflow:hidden; container-type:size;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--cara); color:var(--tx); border-radius:var(--radio-movil,14px);
  box-shadow:var(--sombra-carta);
}
/* Las caras van 1px por delante y el contenedor no recibe toques:
   si no, queda en el mismo plano que la cara y a veces se queda con el toque */
.inclina, .carta{ pointer-events:none; }
.cara{ pointer-events:auto; }
.frente{ transform:translateZ(1px); }
.dorso{ transform:rotateY(180deg) translateZ(1px); }
.frente{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 26px; }
.capa{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; text-align:center;
  opacity:0; visibility:hidden; transition:opacity .3s ease, visibility .3s;
}
.capa.visible{ opacity:1; visibility:visible; }
/* Reflejo de luz que se mueve con el giroscopio */
.brillo{
  position:absolute; inset:0; pointer-events:none; z-index:3; mix-blend-mode:var(--brillo-modo,screen);
  background:radial-gradient(70% 45% at var(--bx) var(--by), var(--brillo,rgba(255,255,255,.16)), transparent 70%);
}

.linea{ display:block; width:44px; height:1px; background:var(--acento); }
.etiqueta{ font-size:10.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--acento); }

/* Anverso */
.p-marca{ margin-top:auto; display:flex; flex-direction:column; align-items:center; gap:24px; }
.frente .logo{ width:min(72cqw,290px); }
.p-texto{ margin-bottom:auto; padding-top:22px; }
.frase{ font-family:var(--serif); font-size:clamp(16px,5.4cqw,21px); line-height:1.35; color:var(--acento); }

/* Ayuda bajo la tarjeta */
.pista{
  display:flex; align-items:center; justify-content:center; gap:10px; min-height:44px; padding:0 18px;
  font-size:12.5px; color:var(--pista);
}
.pista .ico{ font-size:18px; animation:rotar 2.2s ease-in-out infinite; }
@keyframes rotar{ 0%,100%{ rotate:-16deg; } 50%{ rotate:16deg; } }

/* Burbujas de idioma */
.selector{ justify-content:center; gap:clamp(24px,8cqh,48px); padding:26px 16px 14px; }
.sel-es{ font-family:var(--serif); font-size:clamp(24px,8.4cqw,32px); line-height:1.2; color:var(--tx); }
.sel-en{ margin-top:6px; font-size:13px; color:var(--tx2); }
.burbujas{ display:flex; justify-content:center; gap:clamp(16px,7cqw,34px); }
.burbuja{ display:flex; flex-direction:column; align-items:center; transition:scale .25s cubic-bezier(.3,1.4,.5,1); }
.burbuja:active{ scale:.93; }
.burbuja.cerca{ scale:1.12; }
.burbuja-esfera{
  position:relative; display:block; width:clamp(92px,33cqw,132px); aspect-ratio:1; border-radius:50%; padding:4px; margin-bottom:16px;
  background:linear-gradient(150deg, rgba(255,255,255,.9), var(--oro) 45%, rgba(255,255,255,.35));
  box-shadow:0 14px 28px var(--sombra-burbuja), 0 2px 6px var(--sombra-burbuja);
  animation:flotar 4.2s ease-in-out infinite;
}
.burbuja:last-child .burbuja-esfera{ animation-delay:-2.1s; }
.burbuja-esfera img{ display:block; width:100%; height:100%; border-radius:50%; object-fit:cover; }
/* Brillo de burbuja */
.burbuja-esfera::after{
  content:''; position:absolute; inset:4px; border-radius:50%; pointer-events:none;
  background:
    radial-gradient(circle at 32% 24%, rgba(255,255,255,.85), rgba(255,255,255,.18) 22%, transparent 42%),
    radial-gradient(circle at 50% 50%, transparent 58%, rgba(10,20,40,.28) 100%);
}
@keyframes flotar{ 0%,100%{ translate:0 -5px; } 50%{ translate:0 5px; } }
.selector.visible .burbuja{ animation:brotar .6s cubic-bezier(.3,1.5,.5,1) .4s backwards; }
.selector.visible .burbuja:last-child{ animation-delay:.52s; }
@keyframes brotar{ from{ opacity:0; scale:.4; } to{ opacity:1; scale:1; } }
.burbuja-nombre{ font-size:15.5px; font-weight:500; color:var(--tx); }
.burbuja-pais{ margin-top:2px; font-size:12px; color:var(--tx2); }

.volver{ display:inline-flex; align-items:center; justify-content:center; gap:9px; min-height:44px; padding:0 14px; font-size:12.5px; color:var(--tx2); }
.volver .ico{ font-size:15px; }

/* Contacto */
.c-cab{ width:100%; display:flex; flex-direction:column; align-items:center; gap:10px; padding:clamp(20px,5.500cqh,36px) 24px 0; }
.c-cab .logo{ width:clamp(70px,25cqw,104px); }
.c-cuerpo{ flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(4px,1.6cqh,14px); padding:6px 24px 8px; text-align:left; min-height:0; }
.contacto .fila{ grid-template-columns:18px 1fr; gap:13px; padding:clamp(7px,1.6cqh,13px) 0; }
.contacto .fila span, .contacto .fila a{ font-size:14.5px; }
.contacto .redes a{ width:38px; height:38px; }

@container (max-height:500px){
  .c-cab .logo{ display:none; }
  .c-cab{ padding-top:24px; }
  .contacto .fila{ padding:5px 0; }
  .contacto .fila span, .contacto .fila a{ font-size:13.5px; }
  .contacto .fila b{ margin-bottom:1px; font-size:9.5px; }
}

@media (max-width:768px){
  html, body{ height:100%; overflow:hidden; overscroll-behavior:none; }
  body{ background:var(--pagina-movil); display:block; padding:0; min-height:0; }
  body::before{ display:none; }
  .tarjeta{ display:none !important; }
  .movil{ display:block; width:100%; height:100%; }
}
@media (prefers-reduced-motion:reduce){
  *, *::before, *::after{ animation:none !important; transition-duration:.01ms !important; }
}

  --sup:#fbf8f1;

<script>
/* ================= DATOS (edita aquí) ================= */
const redes = { whatsapp:"#", facebook:"#", instagram:"#", linkedin:"#" };

const textos = {
  es: {
    pais:"México · Español", volver:"Volver",
    lema:"Su seguridad, nuestro compromiso",
    dir:"Dirección",  dirVal:"Av. Reforma #123, Puebla, México",
    tel:"Teléfonos",  telVal:[["222 123 4567","+522221234567"],["222 765 4321","+522227654321"]],
    correo:"Correo",  correoVal:"contacto@grupocarma.com",
    horario:"Horario", horarioVal:"Lun - Vie 9:00 - 18:00"
  },
  en: {
    pais:"Canada · English", volver:"Back",
    lema:"Your security, our commitment",
    dir:"Address",   dirVal:"123 Reforma Ave, Puebla, Mexico",
    tel:"Phone",     telVal:[["+52 222 123 4567","+522221234567"]],
    correo:"Email",  correoVal:"contacto@grupocarma.com",
    horario:"Hours", horarioVal:"Mon - Fri 9:00 AM - 6:00 PM"
  }
};

/* ================= RELLENO ================= */
const clonar = id => document.getElementById(id).content.cloneNode(true);

function llenar(raiz, t){
  raiz.querySelectorAll('[data-t]').forEach(el => el.textContent = t[el.dataset.t]);
  raiz.querySelectorAll('[data-tel]').forEach(el => {
    el.textContent = '';
    t.telVal.forEach(([texto, numero], i) => {
      if(i) el.append(' / ');
      const a = document.createElement('a');
      a.href = 'tel:' + numero;
      a.textContent = texto;
      el.append(a);
    });
  });
  raiz.querySelectorAll('[data-correo]').forEach(el => {
    el.textContent = t.correoVal;
    el.href = 'mailto:' + t.correoVal;
  });
}

function ponerRedes(raiz){
  raiz.querySelectorAll('[data-redes]').forEach(el => {
    el.append(clonar('tpl-redes'));
    el.querySelectorAll('[data-red]').forEach(a => {
      a.href = redes[a.dataset.red];
      if(a.getAttribute('href') !== '#'){ a.target = '_blank'; a.rel = 'noopener'; }
    });
  });
}

const sinMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= PC ================= */
const tarjeta = document.getElementById('tarjeta');
document.getElementById('d-filas').append(clonar('tpl-filas'));
ponerRedes(tarjeta);

function marcarIdioma(idioma){
  tarjeta.querySelectorAll('[data-idioma]').forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.idioma === idioma);
  });
}
function pintarDesktop(idioma){
  const t = textos[idioma];
  llenar(tarjeta, t);
  document.getElementById('d-lema').textContent = t.lema;
  document.documentElement.lang = idioma;
  marcarIdioma(idioma);
}

let idiomaDesktop = 'es', tCambio;
function cambiarIdiomaDesktop(idioma){
  if(idioma === idiomaDesktop) return;
  idiomaDesktop = idioma;
  clearTimeout(tCambio);
  tarjeta.classList.add('cambiando');
  marcarIdioma(idioma);
  tCambio = setTimeout(() => {
    pintarDesktop(idioma);
    tarjeta.classList.remove('cambiando');
  }, sinMovimiento ? 0 : 180);
}
tarjeta.querySelectorAll('[data-idioma]').forEach(b => {
  b.addEventListener('click', () => cambiarIdiomaDesktop(b.dataset.idioma));
});
pintarDesktop('es');

/* Inclinación sutil de la tarjeta al mover el ratón */
if(document.body.dataset.inclinar !== undefined && !sinMovimiento &&
   window.matchMedia('(hover:hover) and (pointer:fine)').matches){
  tarjeta.addEventListener('pointermove', e => {
    const r = tarjeta.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    tarjeta.style.setProperty('--rx', ((.5 - y) * 3).toFixed(2) + 'deg');
    tarjeta.style.setProperty('--ry', ((x - .5) * 3).toFixed(2) + 'deg');
    tarjeta.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
    tarjeta.style.setProperty('--my', (y * 100).toFixed(1) + '%');
  });
  tarjeta.addEventListener('pointerleave', () => {
    tarjeta.style.setProperty('--rx', '0deg');
    tarjeta.style.setProperty('--ry', '0deg');
  });
}

/* ================= MÓVIL =================
   La tarjeta sigue la inclinación del teléfono.
   Anverso -> (inclinar) -> se voltea y aparecen las burbujas -> (tocar) -> contacto.
   En el contacto, inclinar a la izquierda = español, a la derecha = inglés. */
const UMBRAL = 30;   // grados de inclinación para voltear o cambiar de idioma
const CENTRO = 12;   // grados para considerar el celular "derecho"
const CERCA  = 12;   // grados para resaltar la burbuja de ese lado

const inclina = document.getElementById('inclina');
const carta = document.getElementById('carta');
const portada = document.getElementById('portada');
const dorso = document.getElementById('dorso');
const selector = document.getElementById('selector');
const contacto = document.getElementById('contacto');
const burbujas = {};
document.querySelectorAll('[data-elegir]').forEach(b => burbujas[b.dataset.elegir] = b);

let estado = 'portada';       // portada | selector | contacto
let sentido = 1;              // hacia qué lado se volteó la tarjeta
let idiomaMovil = null;
let esperarCentro = false;    // espera a que el celular se enderece antes de reaccionar
let cambiando = false;

document.getElementById('m-filas').append(clonar('tpl-filas'));
ponerRedes(contacto);

const anguloBase = () => estado === 'portada' ? 0 : 180 * sentido;

function aplicar(){
  carta.style.transform = `rotateY(${anguloBase()}deg)`;
  portada.inert = estado !== 'portada';
  selector.inert = estado !== 'selector';
  contacto.inert = estado !== 'contacto';
  selector.classList.toggle('visible', estado === 'selector');
  contacto.classList.toggle('visible', estado === 'contacto');
  pintarPista();
}

function vibrar(){ if(navigator.vibrate) navigator.vibrate(30); }

function voltear(nuevoSentido = 1){
  sentido = nuevoSentido;
  estado = 'selector';
  aplicar();
  vibrar();
}

function aPortada(){
  esperarCentro = true;
  estado = 'portada';
  aplicar();
  marcarCerca(null);
}

function elegir(idioma){
  idiomaMovil = idioma;
  llenar(contacto, textos[idioma]);
  contacto.lang = idioma;
  esperarCentro = true;   // que la inclinación actual no cambie el idioma recién elegido
  estado = 'contacto';
  aplicar();
  marcarCerca(null);
}

/* Cambia de idioma dando la vuelta completa a la tarjeta: el texto se
   sustituye cuando la tarjeta está de canto y no se ve */
function cambiarIdiomaMovil(idioma, giro){
  if(idioma === idiomaMovil || cambiando) return;
  vibrar();
  if(sinMovimiento){ elegir(idioma); esperarCentro = false; return; }
  cambiando = true;
  const base = anguloBase();
  const paso = (de, a, easing, ms) => carta.animate(
    [{ transform:`rotateY(${de}deg)` }, { transform:`rotateY(${a}deg)` }],
    { duration:ms, easing }
  );
  paso(base, base + 90 * giro, 'ease-in', 240).onfinish = () => {
    idiomaMovil = idioma;
    llenar(contacto, textos[idioma]);
    contacto.lang = idioma;
    paso(base - 90 * giro, base, 'cubic-bezier(.2,.8,.2,1)', 420).onfinish = () => { cambiando = false; };
  };
}

function marcarCerca(idioma){
  Object.entries(burbujas).forEach(([k, b]) => b.classList.toggle('cerca', k === idioma));
}

Object.values(burbujas).forEach(b => b.addEventListener('click', () => elegir(b.dataset.elegir)));
document.getElementById('a-portada').addEventListener('click', aPortada);
document.getElementById('c-volver').addEventListener('click', () => {
  estado = 'selector';
  aplicar();
});

/* ---------- Texto de ayuda bajo la tarjeta ---------- */
const pista = document.getElementById('pista');
let giroActivo = false;      // ya se recibieron datos del giroscopio
let sinGiro = false;         // el dispositivo no los entrega
let faltaPermiso = false;    // iPhone: falta tocar para pedir permiso

function pintarPista(){
  let txt;
  if(estado === 'selector'){
    txt = 'Toca una bandera · Tap a flag';
  }else if(estado === 'contacto'){
    txt = giroActivo ? 'Inclina para cambiar de idioma · Tilt to switch'
                     : 'Desliza para cambiar de idioma · Swipe to switch';
  }else if(faltaPermiso){
    txt = 'Toca aquí para activar el giroscopio';
  }else{
    txt = sinGiro ? 'Desliza o toca para voltear la tarjeta'
                  : 'Inclina tu teléfono para voltear la tarjeta';
  }
  document.getElementById('pista-txt').textContent = txt;
}

/* ---------- Deslizar con el dedo (por si no hay giroscopio) ---------- */
let x0 = null, y0 = null;
const escena = document.getElementById('escena');
escena.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
escena.addEventListener('touchend', e => {
  if(x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  x0 = null;
  if(Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;   // no fue un deslizamiento horizontal
  const haciaDerecha = dx > 0;
  if(estado === 'portada')       voltear(haciaDerecha ? 1 : -1);
  else if(estado === 'selector') aPortada();
  else cambiarIdiomaMovil(haciaDerecha ? 'es' : 'en', haciaDerecha ? 1 : -1);
}, {passive:true});

/* ---------- Giroscopio ---------- */
const limitar = (v, m) => Math.max(-m, Math.min(m, v));

function alInclinar(e){
  if(e.gamma === null) return;
  if(!giroActivo){
    giroActivo = true;
    faltaPermiso = false;
    inclina.classList.remove('sin-giro');
    pintarPista();
  }
  const g = e.gamma; // izquierda = negativo, derecha = positivo
  const b = e.beta === null ? 45 : e.beta;

  // La tarjeta sigue la mano en todo momento
  if(!sinMovimiento){
    const ry = limitar(g, 30) * .45, rx = limitar(b - 45, 30) * -.35;
    inclina.style.transform = `rotateX(${rx.toFixed(1)}deg) rotateY(${ry.toFixed(1)}deg)`;
    inclina.style.setProperty('--bx', (50 + limitar(g, 30) * 1.5).toFixed(0) + '%');
    inclina.style.setProperty('--by', (50 + limitar(b - 45, 30) * 1.5).toFixed(0) + '%');
  }

  if(esperarCentro){
    if(Math.abs(g) < CENTRO) esperarCentro = false;
    return;
  }
  if(estado === 'portada'){
    if(g < -UMBRAL)      voltear(1);
    else if(g > UMBRAL)  voltear(-1);
  }else if(estado === 'selector'){
    marcarCerca(g < -CERCA ? 'es' : g > CERCA ? 'en' : null);
  }else{
    if(g < -UMBRAL)      cambiarIdiomaMovil('es', 1);
    else if(g > UMBRAL)  cambiarIdiomaMovil('en', -1);
  }
}

const esMovil = window.matchMedia('(max-width:768px)').matches;
const pideIOS = typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function';
let tPermiso = 0;

pista.addEventListener('click', () => {
  if(estado !== 'portada') return;
  if(Date.now() - tPermiso < 800) return;   // este toque solo pedía el permiso
  voltear(1);
});

aplicar();
if(esMovil){
  window.addEventListener('deviceorientation', alInclinar);

  if(pideIOS){
    // iPhone: Apple solo entrega datos tras un toque, así que el permiso
    // se pide en el primer toque en cualquier parte de la pantalla
    faltaPermiso = true;
    pintarPista();
    const pedirPermiso = async () => {
      document.removeEventListener('touchend', pedirPermiso);
      document.removeEventListener('click', pedirPermiso);
      if(giroActivo) return;
      tPermiso = Date.now();
      faltaPermiso = false;
      try{
        const p = await DeviceOrientationEvent.requestPermission();
        if(p !== 'granted') sinGiro = true;
      }catch(err){ sinGiro = true; }
      pintarPista();
    };
    document.addEventListener('touchend', pedirPermiso);
    document.addEventListener('click', pedirPermiso);
  }else{
    setTimeout(() => { if(!giroActivo){ sinGiro = true; pintarPista(); } }, 2000);
  }
}
</script>
